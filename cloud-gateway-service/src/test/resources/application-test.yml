eureka:
    client:
        registerWithEureka: false
        serviceUrl:
            defaultZone: https://localhost:999/eureka/

apiml:
    service:
        id: cloud-gateway
        port: 10023
        hostname: localhost
        scheme: https
    cloudGateway:
        serviceRegistryEnabled: false
        forwardClientCertEnabled: false

server:
    port: ${apiml.service.port}
    ssl:
        keyStore: ../keystore/service/service.keystore.p12
        trustStore: ../keystore/service/service.truststore.p12
        # Custom properties for tests only
        clientKeyStore: ../keystore/client/client-certs.p12
        clientCN: apimtst # case-sensitive
        clientKeyStorePassword: password

#For testing forwarded headers with (un)trusted proxies
test:
    proxyAddress: 6.6.6.6
    trustedProxiesPattern: 6\.6\.6\.6

spring:
    main:
        allow-bean-definition-overriding: true
        allow-circular-references: true
    application:
        name: cloudGateway

logging:
    level:
        org.springframework.cloud.gateway: DEBUG
        reactor.netty: DEBUG
        org.springframework.security: DEBUG


management:
    endpoint:
      gateway:
          enabled: true
