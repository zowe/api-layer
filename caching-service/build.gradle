buildscript {
    repositories mavenRepositories
    dependencies {
        classpath libs.spring.boot.gradle.plugin
        classpath libs.jgit
    }
}

plugins {
    alias(libs.plugins.gradle.git.properties)
}

normalization {
    runtimeClasspath {
        ignore("**/*git.properties*")
        ignore("**/*build-info.properties*")
    }
}

apply plugin: 'org.springframework.boot'
apply plugin: 'com.google.cloud.tools.jib'
apply from: "../gradle/jib.gradle"

def applicationPort = '10016'
def javaAgentPort = '6306'
def debugPort = '5126'
def componentName = "caching-service"

setJib(componentName, javaAgentPort, debugPort, applicationPort)

springBoot {
    // This statement tells the Gradle Spring Boot plugin to generate a file
    // build/resources/main/META-INF/build-info.properties that is picked up by Spring Boot to display
    // via /info endpoint
    buildInfo {
        properties {
            // Generate extra build info:
            additional = [
                by: System.properties['user.name'],
                operatingSystem: "${System.properties['os.name']} (${System.properties['os.version']})",
                number: System.getenv('BUILD_NUMBER') ? System.getenv('BUILD_NUMBER') : "n/a",
                machine: InetAddress.localHost.hostName
            ]
        }
    }
}

gitProperties {
    dotGitDirectory = project.rootProject.layout.projectDirectory.dir(".git")
    gitPropertiesDir = new File("${project.rootDir}/${name}/build/resources/main/META-INF")
}

configurations.all {
    // Remove Spring Cloud enabler
    exclude group: "org.springframework.cloud", module: "spring-cloud-starter-netflix-eureka-client"
}

dependencies {
    api project(':apiml-tomcat-common')
    api project(':onboarding-enabler-spring')
    api project(':apiml-security-common')

    implementation libs.spring.boot.starter.aspectj
    implementation libs.spring.boot.starter.webflux
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.cache
    implementation libs.spring.doc.webflux.ui
    implementation libs.spring.retry
    implementation libs.eureka.jersey.client

    implementation libs.bundles.infinispan

    implementation libs.janino
    implementation libs.jakarta.servlet.api
    implementation libs.lettuce

    testImplementation(testFixtures(project(":apiml-common")))

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter
    testImplementation libs.rest.assured
    testImplementation libs.reactor.test

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
}

jar {
    enabled true
    archiveClassifier = ""
}

test {
    // ApimlSslKeyExchangeTest asserts on the text of OS/JVM network errors
    // ("Connection refused", "Address already in use"). Those strings come from the OS
    // strerror() via the process LC_MESSAGES locale, not from the JVM locale, so on a machine
    // with a non-English LANG they arrive translated (a Czech locale reports "Spojeni
    // odmitnuto" and "Adresa je uzivana") and the assertions fail even though nothing is wrong.
    // The test already accepts the Windows, Linux and macOS wording of these messages, so this
    // only removes the host-locale dependency rather than changing what is asserted.
    //
    // LC_MESSAGES is set rather than LANG/LC_ALL so that only the message catalogue changes:
    // LC_CTYPE and the JVM's own default locale are left as the developer configured them, and
    // CI (already English) is unaffected. The "C" catalogue always exists, unlike an en_US
    // locale which is not installed everywhere.
    environment 'LC_MESSAGES', 'C'
}

bootRun {
    if (project.hasProperty('args')) {
        args project.args.split(',')
    }

    jvmArgs([
        '--add-opens=java.base/java.nio.channels.spi=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/javax.net.ssl=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED'
    ])

    debugOptions {
        port = 5016
        suspend = false
        server = true
    }

    workingDir = project.rootDir

    systemProperties = System.properties
}

bootJar.archiveFileName = bootJar.archiveBaseName.get() + ".jar"
