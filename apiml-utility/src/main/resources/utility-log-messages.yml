    - key: org.zowe.apiml.common.serviceStarted
      number: ZWEAM000
      type: INFO
      text: "%s started in %s seconds"
      reason: "The service started."
      action: "No action required."

    - key: org.zowe.apiml.common.mediationLayerStarted
      number: ZWEAM001
      type: INFO
      text: "API Mediation Layer started"
      reason: "All key API Mediation Layer services started. At least one instance of API ML is available"
      action: "No action required."

    - key: org.zowe.apiml.common.mediationLayerStartedHA
      number: ZWEAM002
      type: INFO
      text: "High Availability initialization complete"
      reason: "All key API Mediation Layer services started. Full configured redundancy achieved"
      action: "No action required."

    - key: org.zowe.apiml.cache.errorOpeningCachingFiles
      number: ZWECS137
      type: WARNING
      text: "Failed to open or access one of the index segment file inside the caching-service directory."
      reason: "A problem occurred while accessing one of the soft-index segment file used by Infinispan caching."
      action: "Verify that:
            - In your system, the MAXFILEPROC parameter is set to a sufficient value. If you still see this error, increase it until it disappears.
            - There is enough space in the caching-service workspace directory.
            - The Zowe user has permission to access the caching-service workspace directory.
            - The caching-service workspace directory has read and write permissions."
