apply plugin: 'jacoco'

ext.javaProjectsWithUnitTests = [
    'apiml',
    'api-catalog-services',
    'common-service-core',
    'discoverable-client',
    'discovery-service',
    'apiml-common',
    'apiml-utility',
    'caching-service',
    'gateway-service',
    'mock-services',
    'onboarding-enabler-java',
    'onboarding-enabler-spring',
    'security-module',
    'security-service-client-spring',
    'onboarding-enabler-micronaut',
    //'onboarding-enabler-micronaut-sample-app',
    'apiml-security-common',
    'zaas-client',
    'certificate-analyser',
    'certificate-common',
    'zosmf-jwt-check',
    'apiml-tomcat-common',
    'apiml-extension-loader',
    'zaas-service',
    // The registry that replaced Eureka. Listed here for the same reason as every other module: without it
    // these modules are compiled, tested and shipped but left out of the aggregate coverage report, so the
    // project's headline number silently excludes the largest new body of code in the cut-over.
    'apiml-registry',
    'apiml-registry-client',
    'apiml-registry-client-spring'
]

ext.jacocoProjects = subprojects.findAll { it.name in javaProjectsWithUnitTests }

configure(jacocoProjects) {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'jacoco'
    jacoco {
        toolVersion = libs.versions.jacoco.get()
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }
}

task jacocoFullReport(type: JacocoReport) {
    // based on sample from https://github.com/SurpSG/jacoco-gradle-plugin-merge-coverage
    description = 'Generates an aggregate report from all subprojects'
    dependsOn(jacocoProjects.jacocoTestReport)

    getAdditionalSourceDirs().from(
        files(jacocoProjects.sourceSets.main.allSource.srcDirs)
    )

    getSourceDirectories().from(
        files(jacocoProjects.sourceSets.main.allSource.srcDirs)
    )

    getClassDirectories().from(
        files(jacocoProjects.sourceSets.main.output)
    )

    getExecutionData().from(
        files(jacocoProjects.jacocoTestReport.executionData)
    )

    if(System.getProperty("results")) {
        for(dir in System.getProperty("results").split(",")){
            def names = []
            fileTree(dir).visit { FileVisitDetails details ->
                names << details.file.path
            }

            getExecutionData().from(
                files(names)
            )
        }
    }


    reports {
        html.required = true
        xml.required = true
    }
}

task coverage() {
    dependsOn jacocoFullReport, ":api-catalog-ui:test", "zowe-cli-id-federation-plugin:test"
}

// The aggregate report reads every module's XML, so those have to be produced before it is written - but
// jacocoProjects.jacocoTestReport only orders the modules that were listed when the task graph was built.
// Chaining the other way as well makes a single `jacocoFullReport` invocation reliable, instead of leaving a
// stale aggregate behind whenever a module's report happens to be scheduled after it.
jacocoFullReport.mustRunAfter(jacocoProjects.jacocoTestReport)
