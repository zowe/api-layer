/**
 * This gradle file add task `liteLibJarAll` which copies lite jar library files to a folder,
 * and `liteLibJarAllJar` which creates a jar containing all libraries.
 * It is helpful if project contains multiple application with different set of dependencies.
 *
 * For `liteLibJarAll` to be used, lite jars of each application must be built first. Then
 * this task will copy all libraries to a folder for all applications.
 * This will reduce the size of data when packaging and deploying.
 **/

def getBaseNameLite() {
    def base;
    if (hasProperty("customBaseName")) {
        base = customBaseName
    } else {
        base = project.name
    }
    return base + "-lite-lib-all"
}

def getLiteLibJar(file, output) {

    if (!file.exists()) return
    if (file.isDirectory()) {
        file.listFiles().each { getLiteLibJar(it, output) }
    } else if (file.name.contains("-lite-lib") && file.name.endsWith(".jar")) {
        logger.info("Processing: " + file.getAbsolutePath())
        logger.info("ZipTree: " + zipTree(file))
        output.add(zipTree(file))
    }

}

def getLiteLibJarOutput(file) {
    def output = []
    if (!file.exists()) return []
    if (file.isDirectory()) {
        file.listFiles().each { getLiteLibJar(it, output) }
    } else if (file.name.contains("-lite-lib") && file.name.endsWith(".jar")) {
        logger.info("Processing: " + file.getAbsolutePath())
        logger.info("ZipTree: " + zipTree(file))
        output.add(zipTree(file))
    }
    return output
}

task liteLibJarAll(type: Copy) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    destinationDir = file("${buildDir}/libs/${getBaseNameLite()}")

    from { rootProject.subprojects.collectMany {
        getLiteLibJarOutput(it.buildDir)
    }.collect() }

    doFirst {
        destinationDir.mkdirs()
    }
}

task liteLibJarAllJar(type: Jar) {
    archiveFileName = getBaseNameLite() + ".jar"
    entryCompression = ZipEntryCompression.STORED
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { rootProject.subprojects.findAll { !(it.name in [
        'onboarding-enabler-java-sample-app-plain-java',
        'onboarding-enabler-spring-sample-app',
        'onboarding-enabler-micronaut',
        'onboarding-enabler-micronaut-sample-app',
        'onboarding-enabler-nodejs',
        'onboarding-enabler-nodejs-sample-app',
        'onboarding-enabler-python',
        'onboarding-enabler-python-sample-app',
        'certificate-analyser',
        'client-cert-auth-sample',
        'discoverable-client',
        'mock-services'
    ])}.collectMany {
        getLiteLibJarOutput(it.buildDir)
    }.collect() }
}

liteLibJarAll.dependsOn(":apiml:build")
liteLibJarAll.dependsOn(":zaas-service:build")
liteLibJarAll.dependsOn(":gateway-service:build")
liteLibJarAll.dependsOn(":discovery-service:build")
liteLibJarAll.dependsOn(":api-catalog-services:build")

liteLibJarAll.dependsOn(":apiml:liteLibJar")
liteLibJarAll.dependsOn(":zaas-service:liteLibJar")
liteLibJarAll.dependsOn(":discovery-service:liteLibJar")
liteLibJarAll.dependsOn(":api-catalog-services:liteLibJar")

liteLibJarAllJar.dependsOn(liteLibJarAll)
liteLibJarAll.finalizedBy(liteLibJarAllJar)
