plugins {
    id 'java'
}

group = 'org.zowe.apiml'
version = '2.18.12-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.http.client
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.16.0'
    implementation group: 'commons-logging', name: 'commons-logging', version: '1.3.5'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'org.zowe.apiml.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

