---
name: zaas
# Component identifier. This identifier matches artifact path in Zowe Artifactory https://zowe.jfrog.io/.
id: org.zowe.apiml.zaas-package
# Component version is defined in gradle.properties for Gradle project
# Human readable component name
title: ZAAS
# Human readable component description
description: Zowe Authentication and Authorization Service.
license: EPL-2.0
schemas:
  configs:
    - schemas/zowe-schema.json
    - schemas/zaas-config.json
repository:
  type: git
  url: https://github.com/zowe/api-layer.git
build:
  branch: "{{build.branch}}"
  number: "{{build.number}}"
  commitHash: "{{build.commitHash}}"
  timestamp: {{build.timestamp}}
commands:
  start: bin/start.sh
# if we need to automatically tag file encoding on z/OS during installation
autoEncoding:
  # tag all files
  - "."
apimlServices:
  dynamic:
    - serviceId: zaas
configs:
  port: 7558
  debug: false
  sslDebug: ""

  apiml:
    security:
      personalAccessToken:
        # 'enabled' is deliberately absent: leaving it unset is what lets the value be taken from
        # components.gateway.apiml.security.personalAccessToken.enabled, as it has been up to now.
        maxScopes: 64
        # empty means "not configured" - the value is then read from the Caching Service, and created there
        # on first use. Set it to pin the cutover fleet-wide.
        cutoverEpoch:
        cutoverSkewAllowanceSeconds: 300
        revocationLookupTimeoutMillis: 2000
        revocationLookupFailureThreshold: 5
        revocationLookupCircuitOpenMillis: 10000
        revocationLookupBatchKeys: 66
        revokeRuleSkewAllowanceMillis: 60000


  server:
    ssl:
      enabled: true

  spring:
    profiles:
      active:
