dependencies {
    api project(':apiml-security-common')

    implementation libs.spring.boot.starter.security
    // Eureka is no longer used here: the only reason it was needed was InstanceLookupExecutor downcasting to
    // EurekaServiceInstance, which now works against Spring Cloud's own ServiceInstance interface.
    implementation libs.spring.cloud.commons
    // Also arrived transitively through the Eureka starter; declared explicitly now.
    implementation libs.http.client5
    implementation libs.jackson.databind

    implementation libs.apache.commons.lang3

    testImplementation libs.spring.boot.starter.test
    testImplementation(testFixtures(project(":apiml-common")))
    testImplementation(testFixtures(project(":apiml-security-common")))

    compileOnly libs.lombok
    testCompileOnly libs.lombok
    annotationProcessor libs.lombok
}
