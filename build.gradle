buildscript {

    ext.mavenRepositories = {
        maven {
            url artifactoryMavenSnapshotRepo
            credentials {
                username mavenUser
                password mavenPassword
            }
        }
        maven {
            url artifactoryMavenRepo
            credentials {
                username mavenUser
                password mavenPassword
            }
        }
        maven {
            url artifactoryPlugins
            credentials {
                username mavenUser
                password mavenPassword
            }
        }
    }

    repositories mavenRepositories

    dependencies {
        classpath libs.gradle.sonar.plugin
        classpath libs.gradle.release
        classpath libs.gradle.licencer
        classpath libs.gradle.jib.plugin
        classpath libs.apache.compress
    }

}

plugins {
    id 'net.minecraftforge.licenser' version '1.2.0' apply false
}

import org.gradle.plugins.ide.eclipse.model.AbstractClasspathEntry
import org.gradle.plugins.ide.eclipse.model.AccessRule
import org.gradle.plugins.ide.eclipse.model.ClasspathEntry

import java.util.regex.Matcher

//noinspection GroovyAssignabilityCheck
group 'org.zowe.apiml'

/*
 * A note for whoever is tempted to move the Node toolchains back under ${rootDir}/tools:
 * api-catalog-ui, zowe-cli-id-federation-plugin, onboarding-enabler-nodejs and
 * onboarding-enabler-nodejs-sample-app each keep their own <project>/tools/{nodejs,npm,yarn}.
 *
 * Sharing one tree breaks under org.gradle.parallel=true. Each project has a private
 * nodeSetup -> npmSetup -> npmInstall chain, so with a shared tree all four npmSetup tasks
 * declare the same output directory: every execution invalidates the other three, one of them
 * reinstalls npm on practically every build, and a project's npmInstall ends up executing
 * tools/npm/npm-v<version>/bin/npm while another project's npmSetup replaces that directory.
 * The victim is SIGKILLed and the build reports "exit value 137 ... may indicate ... out of
 * memory", which sends you looking in entirely the wrong place.
 *
 * Private directories cost disk (~210 MB per project: 195 MB unpacked node, 16 MB npm) and buy:
 * no cross-project invalidation, setup tasks that stay up to date, full parallelism, and no
 * coordination code here. They cost no extra download — Gradle resolves the distribution as
 * org.nodejs:node:<version> and caches the 50 MB tarball once per machine in
 * ~/.gradle/caches/modules-2, and npm caches its own tarball in ~/.npm/_cacache.
 */

apply plugin: 'java-library'

apply from: 'gradle/license.gradle'
apply from: 'gradle/publish.gradle'
apply from: 'gradle/sonar.gradle'
apply from: 'gradle/coverage.gradle'
apply from: 'gradle/code-quality.gradle'
apply from: 'gradle/lite.gradle'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

allprojects {
    apply plugin: 'idea'
    apply plugin: 'net.minecraftforge.licenser'
    apply plugin: 'eclipse'

    repositories mavenRepositories

    version = version

    eclipse {
        classpath {
            file {
                whenMerged { classpath ->
                    for (ClasspathEntry entry : classpath.getEntries()) {
                        if (entry instanceof AbstractClasspathEntry) {
                            AbstractClasspathEntry theEntry = (AbstractClasspathEntry) entry
                            if (theEntry.path != null && theEntry.path.contains('org.eclipse.jdt.launching.JRE_CONTAINER')) {
                                theEntry.accessRules.add(new AccessRule('accessible', 'com/sun/net/httpserver/**'))
                            }
                        }
                    }
                }
            }
            downloadJavadoc = true
            downloadSources = true
        }
    }

    idea {
        module {
            //noinspection GroovyAssignabilityCheck
            outputDir file('build/classes/main')
            //noinspection GroovyAssignabilityCheck
            testOutputDir file('build/classes/test')
            downloadJavadoc = true
            downloadSources = true
        }
    }

    sourceSets {
        main {
            java { srcDirs = ['src/main/java'] }
            resources { srcDirs = ['src/main/resources'] }
        }
        test {
            java { srcDirs = ['src/test/java'] }
            resources { srcDirs = ['src/test/resources'] }
        }
    }

    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute(module('javax.servlet:servlet-api')).using(module('javax.servlet:javax.servlet-api:4.0.1'))

            substitute(module('com.sun.mail:mailapi')).using(module("jakarta.mail:jakarta.mail-api:${libs.versions.mailapi}"))
        }
    }

}

configure(subprojects.findAll { it.name in [
    'apiml-common-lib-package',
    'api-catalog-services',
    'caching-service',
    'discovery-service',
    'gateway-service',
    'apiml',
    'zaas-service',
    'integration-tests'
]}) {

    configurations.all {
        // it has been replaced by spring-jcl
        exclude group: "commons-logging", module: "commons-logging"
        // exclude netty platform specific native libraries from distribution
        exclude group: "io.netty", module: "netty-codec-native-quic"
    }

}

configure(subprojects.findAll {it.name != 'platform'}) {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    test {
        maxHeapSize = '2g'
        useJUnitPlatform()
        jvmArgs '--add-opens=java.base/java.nio.channels.spi=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/java.util=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/javax.net.ssl=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/java.net=ALL-UNNAMED'
        jvmArgs '--add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED'
    }

    dependencies {
        api(platform(project(":platform")))

        testImplementation libs.junit.jupiter

        testImplementation libs.junit.platform.launcher

        //For Idea
        testImplementation libs.junit.platform.commons
        testImplementation libs.junit.platform.engine
    }

}

subprojects {
    license {
        header = rootProject.file('.licence/EPL-2.0-license-header.txt')
        exclude '**/*.yml', '**/*.yaml', '**/*.json', '**/static', '**/*.sh', '**/*.txt', '**/*.p12', '**/*.xml', '**/*.jsp', '**/*.html', '**/*.jks', '**/*.properties'
    }

    tasks.withType(Test) {
        maxParallelForks = 1
    }
}

ext.enablers = [
    'onboarding-enabler-spring',
    'onboarding-enabler-java',
    //'onboarding-enabler-micronaut'
    'zaas-client',
]

ext.javaLibraries = [
    'apiml-utility',
    'apiml-common',
    'apiml-security-common',
    'apiml-tomcat-common',
    'certificate-analyser',
    'zosmf-jwt-check',
    'common-service-core',
    'security-service-client-spring',
    'apiml-sample-extension',
    'apiml-sample-extension-package',
    'apiml-extension-loader'
]

ext.servicesToPublish = [
    'apiml',
    'apiml-package',
    'apiml-common-lib-package',
    'api-catalog-services',
    'api-catalog-package',
    'caching-service',
    'caching-service-package',
    'discovery-service',
    'discovery-package',
    'zaas-service',
    'zaas-package',
    'gateway-service',
    'gateway-package'
]
ext.projectsToPublish = ext.servicesToPublish + ext.javaLibraries

task 'buildZoweServer' {
    group 'Zowe Server components'
    description 'Builds only main zowe server components.'
    dependsOn projectsToPublish.collect { "$it:build" }
    doLast {
        println "Successfully built all 'Zowe Server components' modules."
    }
}
task 'buildEnablers' {
    group 'Enablers'
    description 'Builds only enablers.'
    dependsOn enablers.collect { "$it:build" }
    doLast {
        println "Successfully built all 'Enabler' modules."
    }
}

task buildCore(dependsOn: [':discovery-service:build', ':api-catalog-services:build', ':api-catalog-ui:build',
                           ':discoverable-client:build', ':zaas-client:build', ':apiml-sample-extension:build', ':gateway-service:build']) {
    description "Build core components"
    group "build"
}

task runAllIntegrationTests(dependsOn: ":integration-tests:runAllIntegrationTests") {
    description "Run all integration tests"
    group "Integration tests"
}

task environmentCheck(dependsOn: ":integration-tests:environmentCheck") {
    description "Environment check"
    group "Integration tests"
}

task runCITests(dependsOn: [":integration-tests:runCITests"]) {
    description "Run Integration Test Without MF Dependencies"
    group "Integration tests"
}

task runStartUpCheck(dependsOn: [":integration-tests:runStartUpCheck"]) {
    description "Run Startup check"
    group "Integration tests"
}

task runContainerTests(dependsOn: [":integration-tests:runContainerTests"]) {
    description "Run Integration Test Without MF Dependencies"
    group "Integration tests"
}

task runRegistrationTests(dependsOn: [":integration-tests:runRegistrationTests"]) {
    description "Run Integration Test verifying registration and deregistration"
    group "Integration tests"
}

task runGatewayProxyTest(dependsOn: [":integration-tests:runGatewayProxyTest"]) {
    description "Run tests verifying central gateway can route to correct gateway"
    group "Integration tests"
}

task runIdPrefixReplacerTests(dependsOn: [":integration-tests:runIdPrefixReplacerTests"]) {
    description "Run Integration Test verifying the service ID prefix replacer mechanism"
    group "Integration tests"
}

task publishAllVersions {
    group 'Zowe Publishing'
    description 'Publish Zowe server ZIP files and libraries to Zowe Artifactory'
    doLast {
        println 'Published Zowe server ZIP files and libraries'
    }
}

task publishAllSDKVersions {
    group 'Zowe Publishing'
    description 'Publish SDK libraries to Zowe Artifactory'
    doLast {
        println 'Published SDK libraries'
    }
}

task nodejsClean(type: Delete) {
    group = 'npm'
    if (cleanNode == 'true') {
        // Every project that applies the Node plugin keeps its toolchain in <project>/tools
        ['api-catalog-ui', 'zowe-cli-id-federation-plugin',
         'onboarding-enabler-nodejs', 'onboarding-enabler-nodejs-sample-app'].each { name ->
            delete "$name/tools/nodejs", "$name/tools/npm", "$name/tools/yarn"
        }
    }
}


task runBaseTests(dependsOn: ":integration-tests:runBaseTests") {
    description "Run base tests"
    group "Integration tests"
}

task runZosmfAuthTest(dependsOn: ":integration-tests:runZosmfAuthTest") {
    description "Run zOSMF dependant authentication tests only"
    group "Integration tests"
}
task runZaasTest(dependsOn: ":integration-tests:runZaasTest") {
    description "Run Zaas dependant authentication tests only"
    group "Integration tests"
}

task runCachingServiceTests(dependsOn: ":integration-tests:runCachingServiceTests") {
    description "Run caching service tests"
    group "Integration tests"
}
task runInfinispanJGroupStabilityTest(dependsOn: ":integration-tests:runInfinispanJGroupStabilityTest") {
    description "Run JGroup stability tests for caching service with infinispan storage option"
    group "Integration tests"
}
task runInfinispanServiceTests(dependsOn: ":integration-tests:runInfinispanServiceTests") {
    description "Run tests for caching service with infinispan storage option"
    group "Integration tests"
}
task runModulithInfinispanServiceTests(dependsOn: ":integration-tests:runModulithInfinispanServiceTests") {
    description "Run tests for APIML with infinispan storage option"
    group "Integration tests"
}
task runHATests(dependsOn: ":integration-tests:runHATests") {
    description "Run HA tests only"
    group "Integration tests"
}
task runChaoticHATests(dependsOn: ":integration-tests:runChaoticHATests") {
    description "Run Chaotic HA tests tests only"
    group "Integration tests"
}

clean.dependsOn nodejsClean

tasks.register('generateKeystores', Exec) {
    group = 'build'
    description = 'Generate TLS keystores for local development and testing'
    workingDir = rootProject.projectDir
    if (System.getProperty('os.name').toLowerCase().contains('win')) {
        commandLine 'cmd', '/c', 'bash scripts/generate-keystores.sh'
    } else {
        commandLine 'bash', 'scripts/generate-keystores.sh'
    }
    inputs.file(layout.projectDirectory.file('scripts/generate-keystores.sh'))
    outputs.dir(layout.projectDirectory.dir('keystore'))
    onlyIf {
        if (project.hasProperty('skipKeystoreGeneration')) {
            logger.lifecycle('Keystore generation skipped: skipKeystoreGeneration property is set')
            return false
        }
        // Check for a representative set rather than "any *.p12 exists": a partial tree
        // (interrupted run, incomplete CI artifact) must regenerate, not silently skip.
        def required = [
            'keystore/localhost/localhost.keystore.p12',
            'keystore/localhost/localhost.truststore.p12',
            'keystore/localhost/nonlocalhost.keystore.p12',
            'keystore/docker/all-services.keystore.p12',
            'keystore/client_cert/client-certs.p12',
            'zaas-client/src/test/resources/localhost.keystore.p12',
            'common-service-core/src/test/resources/jwt-public-key.pub'
        ]
        def missing = required.findAll { !file(it).exists() }

        // Whether the existing tree came from the script as it stands now. Gradle's own
        // up-to-date check cannot answer this: it needs execution history, which a fresh
        // clone and a CI job that unpacked the keystore artifact both lack — so a changed
        // script would otherwise never regenerate anything on a developer machine that
        // already has keystores.
        def script = file('scripts/generate-keystores.sh')
        def stamp = file('keystore/generation.stamp')
        def expectedStamp = java.security.MessageDigest.getInstance('SHA-256')
            .digest(script.bytes).encodeHex().toString()
        def stale = !stamp.exists() || stamp.text.trim() != expectedStamp

        if (missing.isEmpty() && !stale) {
            logger.lifecycle('Keystore generation skipped: keystores are present and up to date')
            return false
        }

        def opensslAvailable = { ->
            try {
                def proc = 'openssl version'.execute()
                proc.waitFor()
                return proc.exitValue() == 0
            } catch (IOException ignored) {
                return false
            }
        }

        // Without openssl nothing can be generated. Carry on with a stale-but-complete
        // tree, but never pretend a missing one is fine — let the script report the
        // missing prerequisite instead of failing later as an unexplained TLS error.
        if (!opensslAvailable() && missing.isEmpty()) {
            logger.warn('WARNING: keystores were generated by an older revision of ' +
                'scripts/generate-keystores.sh, but openssl is not available to regenerate them')
            return false
        }

        if (!missing.isEmpty()) {
            logger.lifecycle("Generating keystores: missing ${missing.size()} of ${required.size()} expected files")
        } else {
            logger.lifecycle('Generating keystores: scripts/generate-keystores.sh changed since they were last generated')
        }
        true
    }
}

// The generated test fixtures under zaas-client/src/test/resources and
// common-service-core/src/test/resources are produced by generate-keystores.sh itself.
// They are deliberately NOT modelled as Gradle task outputs: doing so would make those
// source directories task outputs, and every task that reads them (checkLicenseTest,
// processTestResources, ...) would need an explicit ordering. Licence checking has
// nothing to do with TLS material and must not wait on it.
//
// Keystores are TLS material needed to RUN the services — locally, under test, or baked
// into a container image. Nothing else should wait on them: compiling, licence checking,
// javadoc, jars, packaging and publishing all work fine without any TLS material.
allprojects {
    // Tests start real services over TLS. 21 of the ~25 Java modules read keystore
    // material from their tests, so this is hooked wholesale rather than allowlisted.
    tasks.withType(Test).configureEach {
        dependsOn ':generateKeystores'
    }

    tasks.matching {
        // bootRun     — runs a service locally
        // jib*        — gradle/jib.gradle puts ../keystore in jib.extraDirectories.paths,
        //               so the keystore is baked into the image
        // build       — the documented entry point: after it the repo must be runnable,
        //               including when tests are skipped (`build -x test`)
        it.name in ['bootRun', 'jib', 'jibDockerBuild', 'jibBuildTar', 'build']
    }.configureEach {
        dependsOn ':generateKeystores'
    }
}
//
// In CI the script does not run in downstream jobs, so those two fixtures travel in the
// keystore artifact — see the Upload keystores step in integration-tests.yml.
//
// processTestResources does need them: common-service-core loads jwt-public-key.pub from
// the classpath, so it must be on disk before the resources are copied into build/.
['zaas-client', 'common-service-core'].each { name ->
    project(":$name") {
        tasks.named('processTestResources') {
            dependsOn ':generateKeystores'
        }
    }
}

publishAllVersions.dependsOn publishZoweServerArtifacts

publishAllSDKVersions.dependsOn publishZoweServerArtifacts
publishAllSDKVersions.dependsOn publishSDKArtifacts

//-----------Release part start
apply plugin: 'net.researchgate.release'

ext.releaseScope = project.hasProperty('release.scope') ? project.getProperty('release.scope') : 'patch'

release {
    failOnCommitNeeded = true
    failOnPublishNeeded = true
    failOnSnapshotDependencies = true
    failOnUnversionedFiles = false
    failOnUpdateNeeded = true
    revertOnFail = true
    preCommitText = '[Gradle Release plugin]'
    preTagCommitMessage = '[skip ci] Before tag commit'
    tagCommitMessage = 'Release:'
    tagTemplate = 'v${version}'
    newVersionCommitMessage = 'Create new version:'
    versionPropertyFile = 'gradle.properties'
    buildTasks = project.hasProperty('releaseEnablers') ? ['buildZoweServer', 'buildEnablers'] : ['buildZoweServer']

    if (releaseScope == 'minor') {
        versionPatterns = [
            /[.]*\.(\d+)\.(\d+)[.]*/: { Matcher m, Project p -> m.replaceAll(".${(m[0][1] as int) + 1}.0") }
        ]
    } else if (releaseScope == 'major') {
        versionPatterns = [
            /(\d+)\.(\d+)\.(\d+)[.]*/: { Matcher m, Project p -> m.replaceAll("${(m[0][1] as int) + 1}.0.0") }
        ]
    } else {
        versionPatterns = [
            /(\d+)([^\d]*$)/: { Matcher m, Project p -> m.replaceAll("${(m[0][1] as int) + 1}${m[0][2]}") }
        ]
    }

    scmAdapters = [
        net.researchgate.release.GitAdapter
    ]

    git {
        requireBranch.set('')
        pushToRemote.set('origin')
        pushToBranchPrefix.set('')
        commitVersionFileOnly.set(true)
        signTag.set(false)
    }
}

if (project.hasProperty('releaseEnablers')) {
    afterReleaseBuild.dependsOn publishAllSDKVersions
} else {
    afterReleaseBuild.dependsOn publishAllVersions
}
//-----------Release part end


if (hasProperty('buildScan')) {
    buildScan {
        termsOfServiceUrl = 'https://gradle.com/terms-of-service'
        termsOfServiceAgree = 'yes'
    }
}
