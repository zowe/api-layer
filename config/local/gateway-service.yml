spring.profiles.active: debug,diag

apiml:
    health.protected: true
    gateway.registry.enabled: true
    security.x509.registry.allowedUsers: Zowe Service
    service:
        apimlId: apiml1
        forwardClientCertEnabled: true
        hostname: localhost
        port: 10010
    banner: console
    security:
        x509:
            enabled: true
eureka:
    client:
        serviceUrl:
            defaultZone: https://localhost:10011/eureka/
    instance:
        ipAddress: 127.0.0.1

server:
    max-http-request-header-size: 16348

    ssl:
        keyAlias: localhost
        keyPassword: password
        keyStore: keystore/localhost/localhost.keystore.p12
        keyStorePassword: password
        keyStoreType: PKCS12
        trustStore: keystore/localhost/localhost.truststore.p12
        trustStorePassword: password
        trustStoreType: PKCS12
spring:
    output:
        ansi:
            enabled: always
    cloud:
        gateway:
            server:
                webflux:
                    httpclient:
                        websocket:
                            max-frame-payload-length: 3145728
management:
    endpoints:
        web:
            exposure:
                include: "*"

logging:
    pattern: '%d{yyyy-MM-dd HH:mm:ss.SSS,UTC} <%blue(${logbackServiceName}):%magenta(%thread):${PID:}> %X{userid:-} %clr(%-5level) %cyan(\(%logger{15}\)) %msg%n'
