apiml:
    service:
        port: 10025
    banner: console
    security:
        x509:
            certificatesUrl: https://localhost:10010/gateway/certificates
jgroups:
    bind:
        port: 7600
        address: localhost
caching:
    storage:
        mode: infinispan
        infinispan:
            initialHosts: localhost[7099]
spring:
    profiles:
        include: dev

management:
    endpoints:
        web:
            exposure:
                include: "*"
