# Static definitions of Fidelity z/OSMF instances
#
# Once configured you can access these via the API gateway:
# curl -k -X GET -H "X-CSRF-ZOSMF-HEADER: *" https://usilca32.lvn.broadcom.net:1443/${serviceId}/api/v1/info
services:
  - serviceId: testplex
    title: z/OSMF - TEST
    description: 'IBM z/OS Management Facility REST API service'
    catalogUiTileId: TESTPLEX
    instanceBaseUrls:
      - https://usilca32.lvn.broadcom.net:1443/
    homePageRelativeUrl: # Home page is at the same URL
    routedServices:
      - gatewayUrl: api/v1
        serviceRelativeUrl:
    authentication:
      scheme: httpBasicPassTicket
      applid: IZUDFLT
    apiInfo:
      - apiId: ibm.zosmf
        gatewayUrl: api/v1
        documentationUrl: https://www.ibm.com/support/knowledgecenter/en/SSLTBW_3.1.0/com.ibm.zos.v3r1.izua700/IZUHPINFO_RESTServices.htm
        swaggerUrl: https://usilca32.lvn.broadcom.net:1443/zosmf/api/docs
    customMetadata:
      apiml:
        enableUrlEncodedCharacters: true
        headersToIgnore: Origin
        service:
          scheme: https
          nonSecurePortEnabled: false
          securePortEnabled: true
