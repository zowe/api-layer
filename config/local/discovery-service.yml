spring.profiles.active: https,debug,diag

apiml:
    health.protected: true
    service:
        hostname: localhost
        ipAddress: 127.0.0.1
        port: 10011
    discovery:
        staticApiDefinitionsDirectories: config/local/api-defs
    security:
        allowedDomains: localhost,localhost2,www.ibm.com,zowe.github.io,www.zowe.org
        ssl.verifySslCertificatesOfServices: true
    banner: console

spring.output.ansi.enabled: always

management:
    endpoints:
        web:
            exposure:
                include: "*"

logging:
#    pattern: '%d{yyyy-MM-dd HH:mm:ss.SSS,UTC} %clr(<${logbackServiceName}:%thread:${PID:}>) %magenta(%X{userid:-}) %cyan(%-5level) %clr(\(%logger{15}\)) %msg%n'
#    pattern: '%d{yyyy-MM-dd HH:mm:ss.SSS,UTC} <%boldBlue(${logbackServiceName}):%green(%thread):%yellow(${PID:})> %X{userid:-} %clr(%-5level) %cyan(\(%logger{15}\)) %msg%n'
    pattern: '%d{yyyy-MM-dd HH:mm:ss.SSS,UTC} <%blue(${logbackServiceName}):%magenta(%thread):${PID:}> %X{userid:-} %clr(%-5level) %cyan(\(%logger{15}\)) %msg%n'
---
spring.config.activate.on-profile: https

server:
    ssl:
        keyAlias: localhost
        keyPassword: password
        keyStoreType: PKCS12
        keyStore: keystore/localhost/localhost.keystore.p12
        keyStorePassword: password
        trustStoreType: PKCS12
        trustStore: keystore/localhost/localhost.truststore.p12
        trustStorePassword: password
