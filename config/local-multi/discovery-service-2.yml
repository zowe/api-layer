spring.profiles.include: diag

eureka:
    instance:
        ipAddress: 127.0.0.1
    client:
        instanceInfoReplicationIntervalSeconds: 30
        registryFetchIntervalSeconds: 30

apiml:
    service:
        hostname: localhost2
        port: 10021
    discovery:
        staticApiDefinitionsDirectories: config/local/api-defs
        allPeersUrls: https://localhost2:10021/eureka,https://localhost:10011/eureka
    security:
        ssl:
            verifySslCertificatesOfServices: true
        allowedDomains: localhost,localhost2,www.ibm.com,zowe.github.io,www.zowe.org
    banner: console

spring:
    output:
        ansi:
            enabled: always

server:
    ssl:
        keyAlias: localhost
        keyPassword: password
        keyStoreType: PKCS12
        keyStore: keystore/service/service.keystore.p12
        keyStorePassword: password
        trustStoreType: PKCS12
        trustStore: keystore/service/service.truststore.p12
        trustStorePassword: password
