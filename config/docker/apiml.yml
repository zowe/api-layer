spring.profiles.include: diag,debug
apiml:
    service:
        ssl:
            key-store: /docker/client-cert.p12
            key-store-password: password
            key-password: password
            key-alias: localhost
            trust-store: /docker/all-services.truststore.p12
            trust-store-password: password
        apimlId: apiml1
        hostname: apiml
    discovery:
        staticApiDefinitionsDirectories: /api-defs;/docker/api-defs
        allPeersUrls: https://apiml:10011/eureka
    security:
        allowTokenRefresh: true
        personalAccessToken:
            enabled: true
        oidc:
            enabled: true
            clientId:
            clientSecret:
            registry:
            identityMapperUrl:
            identityMapperUser:
            jwks:
                uri:
        auth:
            zosmf:
                serviceId: mockzosmf  # Replace me with the correct z/OSMF service id
        x509:
            enabled: true
        useDummyCNMapper: true
        saf:
            urls:
                authenticate: https://mock-services:10013/zss/saf/authenticate
                verify: https://mock-services:10013/zss/saf/verify
        ssl:
            verifySslCertificatesOfServices: true
        allowedDomains: apiml,apiml-2,apiml-3,discovery-service,discoverable-client,discoverable-client-2,api-catalog-services,caching-service,zaas-service,mock-services,mock-services-2,zowe.github.io,www.zowe.org,localhost,www.ibm.com,central-gateway-service,apiml-unknown,apiml-2-unknown,apiml-3-unknown,discovery-service-unknown,discoverable-client-unknown,discoverable-client-2-unknown,api-catalog-services-unknown,caching-service-unknown,zaas-service-unknown,mock-services-unknown,mock-services-2-unknown,zowe.github.io,www.zowe.org,localhost,www.ibm.com,central-gateway-service-unknown,nodejs-sample-app,python-sample-app,gateway-service,gateway-service-2
    banner: console
spring:
    output:
        ansi:
            enabled: always
    profiles:
        include: diag

eureka:
    client:
        instanceInfoReplicationIntervalSeconds: 30
        registryFetchIntervalSeconds: 30

management:
    endpoints:
        migrate-legacy-ids: true
        web:
            exposure:
                include: "*"
    endpoint:
        shutdown:
            access: unrestricted
        loggers:
            access: read-only

server:
    address: 0.0.0.0
    max-http-request-header-size: 40000
    ssl:
        keyAlias: localhost
        keyPassword: password
        keyStore: /docker/server-only.p12
        keyStorePassword: password
        trustStore: /docker/all-services.truststore.p12
        trustStorePassword: password
