apiml:
    service:
        hostname: discovery-service
    discovery:
        staticApiDefinitionsDirectories: /api-defs;/docker/api-defs
        allPeersUrls: https://discovery-service:10011/eureka
    security:
        ssl:
            verifySslCertificatesOfServices: true
        allowedDomains: discovery-service,discovery-service-2,discoverable-client,discoverable-client-2,api-catalog-services,api-catalog-services-2,caching-service,caching-service-2,caching-service-3,gateway-service,gateway-service-2,mock-services,mock-services-2,zowe.github.io,www.zowe.org,localhost,www.ibm.com,central-gateway-service,central-gateway-service-2,metrics-service,cloud-gateway-service,cloud-gateway-service-2
    banner: console
    metrics:
        serviceId: metrics-service
        enabled: true
spring:
    output:
        ansi:
            enabled: always
    profiles:
        include: diag

eureka:
    client:
        initialInstanceInfoReplicationIntervalSeconds: 1
        registryFetchIntervalSeconds: 1

server:
    address: ${apiml.service.hostname}
    ssl:
        keyAlias: localhost
        keyPassword: password
        keyStore: /docker/all-services.keystore.p12
        keyStorePassword: password
        trustStore: /docker/all-services.truststore.p12
        trustStorePassword: password

