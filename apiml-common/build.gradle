plugins {
    id "java-test-fixtures"
}

dependencies {
    // Previously arrived transitively through spring-cloud-starter-netflix-eureka-client. Declared explicitly
    // now that the starter is gone, so this module states what it actually uses.
    implementation libs.spring.cloud.commons
    implementation libs.http.client5
    api project(':apiml-registry')
    api project(':apiml-utility')

    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.web
    implementation libs.opentelemetry.spring.boot.starter
    implementation libs.opentelemetry.exporter.common
    implementation libs.opentelemetry.exporter.sender.okhttp
    implementation libs.caffeine
    implementation libs.guava

    compileOnly libs.netty.reactor.http

    implementation libs.apache.commons.lang3
    implementation libs.janino

    compileOnly libs.jakarta.validation

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.io.grpc

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    testCompileOnly libs.lombok
    annotationProcessor libs.lombok

    testFixturesImplementation libs.spring.boot.starter.test
    testFixturesImplementation libs.commons.io
    testFixturesImplementation libs.http.client5
    testFixturesImplementation libs.rest.assured
    testFixturesImplementation libs.lombok
    testFixturesAnnotationProcessor libs.lombok
}
