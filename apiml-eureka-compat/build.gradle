/*
 * Netflix Eureka client compatibility.
 *
 * Holds the classes that exist only because Gateway, API Catalog, Caching and ZAAS are still Eureka clients.
 * They were in apiml-common, which every module depends on - including the Discovery Service, which now has no
 * Eureka at all. Keeping them there meant eureka-client and its tail (archaius, xstream, servo, jettison,
 * netflix-eventbus, netflix-infix) stayed on every runtime classpath in the product.
 *
 * This whole module is deleted when Phase 5's per-service cutover finishes.
 */
dependencies {
    api project(':apiml-common')
    api project(':common-service-core')

    implementation libs.spring.cloud.starter.eureka.client
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.web
    implementation libs.jackson.databind
    implementation libs.http.client5
    implementation libs.guava

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.cloud.starter.eureka.client

    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
}
