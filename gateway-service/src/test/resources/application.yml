eureka:
    client:
        registerWithEureka: false
        serviceUrl:
            defaultZone: https://localhost:999/eureka/

apiml:
    service:
        id: gateway
        port: 10010
        hostname: localhost
        scheme: https
        corsEnabled: true
        allowEncodedSlashes: true
        ignoredHeadersWhenCorsEnabled: Access-Control-Request-Method,Access-Control-Request-Headers,Access-Control-Allow-Origin,Access-Control-Allow-Methods,Access-Control-Allow-Headers,Access-Control-Allow-Credentials,Origin
    gateway:
        serviceRegistryEnabled: false
        forwardClientCertEnabled: false
    webClientConfig.enabled: true

server:
    port: ${apiml.service.port}
    ssl:
        clientAuth: want
        keyAlias: localhost
        keyPassword: password
        keyStore: ../keystore/localhost/localhost.keystore.p12
        keyStorePassword: password
        keyStoreType: PKCS12
        trustStore: ../keystore/localhost/localhost.truststore.p12
        trustStorePassword: password
        trustStoreType: PKCS12
        # Custom properties for tests only
        clientKeyStore: ../keystore/client_cert/client-certs.p12
        clientCN: apimtst # case-sensitive
        clientKeyStorePassword: password
    max-http-request-header-size: 48000

#For testing forwarded headers with (un)trusted proxies
test:
    proxyAddress: 6.6.6.6
    trustedProxiesPattern: 6\.6\.6\.6


spring:
    main:
        allow-bean-definition-overriding: true
        allow-circular-references: true
    cloud:
        gateway:
            server:
                webflux:
                    discovery:
                        locator:
                            enabled: false
                            lower-case-service-id: true
    application:
        name: gateway

logging:
    level:
        ROOT: DEBUG
        org.springframework: DEBUG
        org.springframework.web: TRACE
        org.springframework.cloud.gateway: DEBUG
        org.springframework.security: DEBUG
        org.springframework.beans: WARN
        reactor.netty: DEBUG

management:
    endpoint:
      gateway:
          access: unrestricted
    endpoints:
        web:
            base-path: /application
            exposure:
                include: health,gateway

---
spring.config.activate.on-profile: attlsServer

server:
    attlsServer:
        enabled: true
    ssl:
        enabled: false

    service:
        scheme: http
apiml:
    service:
        corsEnabled: true
        scheme: http
        nonSecurePortEnabled: true
        securePortEnabled: false

---
spring.config.activate.on-profile: attlsClient

server:
    attlsClient:
        enabled: true

apiml:
    service:
        discoveryServiceUrls: http://localhost:10011/eureka/

eureka:
    instance:
        metadata-map:
            apiml:
                apiInfo[0]:
                    swaggerUrl: http://${apiml.service.hostname}:${apiml.service.port}/gateway/api-docs
