apiml:
    service:
        id: gateway
        port: 10010
        hostname: localhost
server:
    port: ${apiml.service.port}
    ssl:
        keyAlias: localhost
        keyStore: ../keystore/service/service.keystore.p12
        trustStore: ../keystore/service/service.truststore.p12
        clientKeyStore: ../keystore/client/client-certs.p12
        clientCN: apimtst # case-sensitive
        clientKeyStorePassword: password

spring:
    main:
        allow-bean-definition-overriding: true
    cloud:
        gateway:
            server:
                webflux:
                    discovery:
                        locator:
                            enabled: false
                            lower-case-service-id: true
    application:
        name: gateway

logging:
    level:
        ROOT: DEBUG
        org.springframework.cloud.gateway: TRACE
        org.springframework.http.server.reactive: DEBUG
        org.springframework.web.reactive: DEBUG
        reactor.netty: DEBUG

test:
    proxyAddress: 6.6.6.6
    trustedProxiesPattern: 6\.6\.6\.6

