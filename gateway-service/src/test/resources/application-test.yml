spring.profiles.include: diag
environment.older: false

logging:
    level:
        ROOT: TRACE

apiml:
    service:
        discoveryServiceUrls: https://localhost:10011/eureka/
    gateway:
    security:
        filterChainConfiguration: new
        personalAccessToken:
            enabled: true
        oidc:
            identityMapperUrl: http://localhost:8542/certificate/dn
            identityMapperUser: validUserForMap
        allowTokenRefresh: true
        jwtInitializerTimeout: 5
        ssl:
            verifySslCertificatesOfServices: true
        x509:
            externalMapperUrl: http://localhost:8542/certificate/x509/map
            externalMapperUser: validUserForMap
        auth:
            provider: dummy
            zosmf:
                serviceId: zosmf  # Replace me with the correct z/OSMF service id
                jwtAutoconfiguration: jwt

#For testing forwarded headers with (un)trusted proxies
test:
    proxyAddress: 6.6.6.6
    trustedProxiesPattern: 6\.6\.6\.6

spring:
    profiles:
        include: diag
    main:
        allow-bean-definition-overriding: true

server:
    internal:
        port: 10017
        enabled: true
        ssl:
            keyStore: ../keystore/service/service.keystore.p12
            keyStorePassword: password
            keyPassword: password
            keyAlias: localhost
            trustStore: ../keystore/service/service.truststore.p12
            trustStorePassword: password
            keyStoreType: PKCS12
            trustStoreType: PKCS12
            clientAuth: want
    ssl:
        protocol: TLSv1.2
        enabled-protocols: TLSv1.2
        ciphers: TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384
        keyStore: ../keystore/service/service.keystore.p12
        keyStorePassword: password
        keyPassword: password
        keyAlias: localhost
        trustStore: ../keystore/service/service.truststore.p12
        trustStorePassword: password
    max-http-header-size: 40000

zuul:
    sslHostnameValidationEnabled: false

ribbon:
    client:
        name: testClient

hystrix:
    command:
        default:
            execution:
                isolation:
                    semaphore:
                        maxConcurrentRequests: 100000

management:
    endpoints:
        web:
            exposure:
                include: health,info

    client:
        fetchRegistry: false
        registerWithEureka: false
