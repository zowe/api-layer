# Docker compose for API ML modulith
version: '3.8'

services:
  apiml:
    image: ghcr.io/zowe/apiml:latest
    ports:
      - "10010:10010" # External access
      - "10011:10011" # External access
      - "5010:5130" # For Java remote debugging
    networks:
      - apiml_net
      - apiml_shared
    container_name: apiml
    environment:
      - APIML_SECURITY_AUTH_PROVIDER=dummy
      - APIML_SERVICE_HOSTNAME=apiml
      - APIML_DISCOVERY_ALLPEERSURLS=https://apiml:10011/eureka,https://apiml-2:10011/eureka
      - logbackService=ZWEAGW
      - LOGGING_LEVEL_COM_NETFLIX_EUREKA=DEBUG
      - LOGGING_LEVEL_COM_NETFLIX_EUREKA_DISCOVERYCLIE145NT=DEBUG
      # - APIML_SERVICE_DISCOVERYSERVICEURLS=https://apiml:10011/eureka,https://apiml-2:10011/eureka
  api-catalog:
    image: ghcr.io/zowe/api-catalog-services
    networks:
      - apiml_net
    container_name: api-catalog-services
    environment:
      - APIML_SERVICE_DISCOVERYSERVICEURLS=https://apiml:10011/eureka
      - APIML_SERVICE_HOSTNAME=api-catalog-services

  apiml-2:
    image: ghcr.io/zowe/apiml:latest
    ports:
      - "10020:10010"
      - "10021:10011"
      - "5011:5130"
    networks:
      - apiml2_net
      - apiml_shared
    container_name: apiml-2
    environment:
      - APIML_SECURITY_AUTH_PROVIDER=dummy
      - APIML_SERVICE_HOSTNAME=apiml-2
      - APIML_DISCOVERY_ALLPEERSURLS=https://apiml:10011/eureka,https://apiml-2:10011/eureka
      - logbackService=ZWEAGW2
      #- APIML_SERVICE_DISCOVERYSERVICEURLS=https://apiml:10011/eureka,https://apiml-2:10011/eureka

networks:
  apiml_net:
    driver: bridge

  apiml2_net:
    driver: bridge

  apiml_shared:
    driver: bridge
