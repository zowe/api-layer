apiml:
    security:
        allowedDomains: localhost,localhost2,www.zowe.org,zowe.github.io,www.ibm.com,*.internal.cloudapp.net

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            status:
                order: "DOWN,PARTIAL,UP"
                http-mapping:
                  DOWN: 503
                  PARTIAL: 200

logging:
    level:
        ROOT: DEBUG
        org.springframework: DEBUG

server:
    ssl:
        keyStore: ../keystore/service/service.keystore.p12
        trustStore: ../keystore/service/service.truststore.p12
