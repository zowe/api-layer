apiml:
    discovery:
        allPeersUrls: http://${apiml.service.hostname}:${apiml.service.port}/eureka/
    service:
        id: discovery
        hostname: localhost
        port: 20011
    security:
        allowedDomains: localhost:*,localhost2:*,www.zowe.org,zowe.github.io,www.ibm.com

spring:
    config:
        useLegacyProcessing: true

management:
    endpoint:
        health:
            status:
                order: "DOWN,PARTIAL,UP"
                http-mapping:
                  DOWN: 503
                  PARTIAL: 200

logging:
    level:
        org.springframework: DEBUG

server:
    ssl:
        keyStore: ../keystore/service/service.keystore.p12
        trustStore: ../keystore/service/service.truststore.p12
