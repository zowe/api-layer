buildscript {
    repositories mavenRepositories
    dependencies {
        classpath libs.spring.boot.gradle.plugin
        classpath libs.jgit
    }
}

plugins {
    alias(libs.plugins.gradle.git.properties)
}

normalization {
    runtimeClasspath {
        ignore("**/*git.properties*")
        ignore("**/*build-info.properties*")
    }
}

apply plugin: 'org.springframework.boot'
apply from: "$projectDir/gradle/lite.gradle"
apply plugin: 'com.google.cloud.tools.jib'
apply from: "../gradle/jib.gradle"

def applicationPort = '10011'
def javaAgentPort = '6302'
def debugPort = '5121'
def componentName = "discovery-service"

setJib(componentName, javaAgentPort, debugPort, applicationPort)
jib.container.args.add('--spring.profiles.active=https')


springBoot {
    // This statement tells the Gradle Spring Boot plugin to generate a file
    // build/resources/main/META-INF/build-info.properties that is picked up by Spring Boot to display
    // via /info endpoint
    buildInfo {
        properties {
            // Generate extra build info:
            additional = [
                by: System.properties['user.name'],
                operatingSystem: "${System.properties['os.name']} (${System.properties['os.version']})",
                number: System.getenv('BUILD_NUMBER') ? System.getenv('BUILD_NUMBER') : "n/a",
                machine: InetAddress.localHost.hostName
            ]
        }
    }
}

gitProperties {
    dotGitDirectory = project.rootProject.layout.projectDirectory.dir(".git")
    gitPropertiesDir = new File("${project.rootDir}/${name}/build/resources/main/META-INF")
}

dependencies {
    api project(':apiml-tomcat-common')
    api project(':apiml-common')
    api project(':security-service-client-spring')
    api project(':apiml-registry')

    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.web
    // Previously arrived transitively through spring-cloud-starter-netflix-eureka-server. Declared explicitly
    // now that the starter is gone, so the module states what it actually uses.
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.cloud.commons

    implementation libs.apache.commons.lang3
    implementation libs.http.client5
    implementation libs.jackson.dataformat.yaml
    implementation libs.caffeine

    testImplementation(testFixtures(project(":apiml-common")))

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.rest.assured
    // Test scope only: the Phase 0 wire-contract capture tests drive Eureka's own codecs to prove our
    // encoder still matches. Deliberately not on the runtime classpath - that is the point of this work.
    testImplementation libs.eureka.core
    testImplementation libs.eureka.jersey.client
    testImplementation libs.netflix.servo

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
}


test {
    // Phase 0 wire-contract capture: forwarded so `-Dwire.contract.regenerate=true` on the Gradle
    // command line reaches the forked test JVM, where EurekaWireContractCaptureTest reads it.
    systemProperty 'wire.contract.regenerate', System.getProperty('wire.contract.regenerate', 'false')
}

bootJar {
    archiveFileName = "discovery-service.jar"
    manifest {
        attributes 'Main-Class': 'org.springframework.boot.loader.launch.PropertiesLauncher'
    }
    archiveClassifier = "application"
}

jar {
    enabled true
    archiveClassifier = ""
}

bootRun {
    if (project.hasProperty('args')) {
        args project.args.split(',')
    }

    jvmArgs([
        '--add-opens=java.base/java.nio.channels.spi=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/javax.net.ssl=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED'
    ])

    debugOptions {
        port = 5011
        suspend = false
        server = true
    }

    workingDir = project.rootDir

    systemProperties = System.properties
}

publishing {
    publications {
        mavenJavaFat(MavenPublication) {
            groupId = 'org.zowe.apiml'
            artifactId = 'discovery-fat-jar'

            artifact bootJar
        }
    }
}
