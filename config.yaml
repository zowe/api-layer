receivers:
  # OTLP receiver to receive telemetry data from services
  # Services are configured to send to localhost:4318 (HTTP) and localhost:4317 (gRPC)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # OTLP HTTP exporter to forward telemetry to the golden collector
  # Using container name 'golden' since both containers are on the same Docker network 'otel-net'
  debug:
    verbosity: detailed
  otlphttp:
    endpoint: "http://golden:4318"
    tls:
      insecure: true
  nop: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: []
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: []
      exporters: [otlphttp]

