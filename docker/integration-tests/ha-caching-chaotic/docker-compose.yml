services:

    # Every "-2"/"-3" service below shares its primary's real port. The test runner (host-based
    # now) reaches each secondary instance via a different HOST port instead (a consistent
    # +10000/+10 offset convention used across this repo's HA compose files), via
    # -D*.connectPorts / -Ddiscovery.additionalPort on this job's gradle invocations (the shared
    # environment-configuration-ha.yml stays untouched - several other jobs also use it). See
    # docker/integration-tests/README.md. Chaos is induced via HTTP calls to each instance's own
    # actuator shutdown endpoint (MANAGEMENT_ENDPOINT_SHUTDOWN_ACCESS below), not by manipulating
    # containers directly, so no special handling is needed for that.
    api-catalog-services:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/api-catalog-services:${APIML_TAG:-local}
        hostname: api-catalog-services
        volumes:
            - ./api-defs:/api-defs
        environment:
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service:10011/eureka/,https://discovery-service-2:10011/eureka/
        ports:
            - "127.0.0.1:10014:10014"
            - "127.0.0.1:5124:5124"
            - "127.0.0.1:6304:6304"

    api-catalog-services-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/api-catalog-services:${APIML_TAG:-local}
        hostname: api-catalog-services-2
        volumes:
            - ./api-defs:/api-defs
        environment:
            APIML_SERVICE_HOSTNAME: api-catalog-services-2
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service-2:10011/eureka/,https://discovery-service:10011/eureka/
            APIML_HEALTH_PROTECTED: "false"
            logbackService: ZWEAAC2
        ports:
            - "127.0.0.1:20014:10014"
            - "127.0.0.1:25124:5124"
            - "127.0.0.1:26304:6304"

    caching-service:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/caching-service:${APIML_TAG:-local}
        hostname: caching-service
        environment:
            CACHING_STORAGE_MODE: infinispan
            CACHING_STORAGE_INFINISPAN_INITIALHOSTS: "caching-service[7600],caching-service-2[7600],caching-service-3[7600]"
            JGROUPS_BIND_PORT: "7600"
            JGROUPS_BIND_ADDRESS: caching-service
            JGROUPS_KEYEXCHANGE_PORT: "7601"
            APIML_SERVICE_HOSTNAME: caching-service
            APIML_HEALTH_PROTECTED: "false"
            MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
            MANAGEMENT_ENDPOINT_SHUTDOWN_ACCESS: unrestricted
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service:10011/eureka/,https://discovery-service-2:10011/eureka/
        ports:
            - "127.0.0.1:10016:10016"
            - "127.0.0.1:5126:5126"
            - "127.0.0.1:6306:6306"

    caching-service-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/caching-service:${APIML_TAG:-local}
        hostname: caching-service-2
        environment:
            CACHING_STORAGE_MODE: infinispan
            CACHING_STORAGE_INFINISPAN_INITIALHOSTS: "caching-service[7600],caching-service-2[7600],caching-service-3[7600]"
            JGROUPS_BIND_PORT: "7600"
            JGROUPS_BIND_ADDRESS: caching-service-2
            JGROUPS_KEYEXCHANGE_PORT: "7601"
            APIML_SERVICE_HOSTNAME: caching-service-2
            APIML_HEALTH_PROTECTED: "false"
            MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
            MANAGEMENT_ENDPOINT_SHUTDOWN_ACCESS: unrestricted
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service-2:10011/eureka/,https://discovery-service:10011/eureka/
            logbackService: ZWEACS2
        ports:
            - "127.0.0.1:20016:10016"
            - "127.0.0.1:25126:5126"
            - "127.0.0.1:26306:6306"

    caching-service-3:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/caching-service:${APIML_TAG:-local}
        hostname: caching-service-3
        environment:
            CACHING_STORAGE_MODE: infinispan
            CACHING_STORAGE_INFINISPAN_INITIALHOSTS: "caching-service[7600],caching-service-2[7600],caching-service-3[7600]"
            JGROUPS_BIND_PORT: "7600"
            JGROUPS_BIND_ADDRESS: caching-service-3
            JGROUPS_KEYEXCHANGE_PORT: "7601"
            APIML_SERVICE_HOSTNAME: caching-service-3
            APIML_HEALTH_PROTECTED: "false"
            MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
            MANAGEMENT_ENDPOINT_SHUTDOWN_ACCESS: unrestricted
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service:10011/eureka/,https://discovery-service-2:10011/eureka/
            logbackService: ZWEACS3
        ports:
            - "127.0.0.1:30016:10016"
            - "127.0.0.1:35126:5126"
            - "127.0.0.1:36306:6306"

    discoverable-client:
