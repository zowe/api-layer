services:

    # Domain apiml instance which registers its gateway in central's discovery service
    discovery-service:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/discovery-service:${APIML_TAG:-local}
        hostname: discovery-service
        volumes:
            - ./api-defs:/api-defs
        ports:
            - "127.0.0.1:10011:10011"
            - "127.0.0.1:5121:5121"

    api-catalog-services:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/api-catalog-services:${APIML_TAG:-local}
        hostname: api-catalog-services
        volumes:
            - ./api-defs:/api-defs
        ports:
            - "127.0.0.1:10014:10014"
            - "127.0.0.1:5124:5124"
            - "127.0.0.1:6304:6304"

    zaas-service:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/zaas-service:${APIML_TAG:-local}
        hostname: zaas-service
        environment:
            APIML_SECURITY_X509_ENABLED: "true"
            APIML_SECURITY_X509_ACCEPTFORWARDEDCERT: "true"
            APIML_SECURITY_X509_CERTIFICATESURL: https://central-gateway-service:10010/gateway/certificates
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service:10011/eureka/
            logbackService: ZWEAAZ2
        ports:
            - "127.0.0.1:10023:10023"
            - "127.0.0.1:5120:5120"
            - "127.0.0.1:6301:6301"

    gateway-service:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/gateway-service:${APIML_TAG:-local}
        hostname: gateway-service
        environment:
            APIML_SERVICE_APIMLID: domain-apiml
            APIML_SERVICE_EXTERNALURL: https://gateway-service:10010
            APIML_GATEWAY_REGISTRY_ENABLED: "false"
            APIML_SECURITY_X509_REGISTRY_ALLOWEDUSERS: USER,UNKNOWNUSER
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service:10011/eureka/
            ZWE_CONFIGS_APIML_SERVICE_ADDITIONALREGISTRATION_0_DISCOVERYSERVICEURLS: https://discovery-service-2:10011/eureka
            ZWE_CONFIGS_APIML_SERVICE_ADDITIONALREGISTRATION_0_ROUTES_0_GATEWAYURL: /
            ZWE_CONFIGS_APIML_SERVICE_ADDITIONALREGISTRATION_0_ROUTES_0_SERVICEURL: /
            logbackService: ZWEAGW2
        ports:
            - "127.0.0.1:10010:10010"
            - "127.0.0.1:5130:5130"
            - "127.0.0.1:6300:6300"

    discoverable-client:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/discoverable-client:${APIML_TAG:-local}
        hostname: discoverable-client
        ports:
            - "127.0.0.1:10012:10012"
            - "127.0.0.1:5122:5122"

    # Central apiml instance with central gateway registry. central-gateway-service shares
    # gateway-service's real port; discovery-service-2 shares discovery-service's. The test
    # runner (host-based now) reaches them via -Dcentralgateway.port / -Ddiscovery.additionalPort
    # on this job's gradle invocations instead. api-catalog-services-2/zaas-service-2 aren't part
    # of the generic checker's scope in this job (matches original behaviour, neither
    # apiCatalogServiceConfiguration nor ZaasConfiguration has an additional-host in
    # environment-configuration-docker.yml) but still get their own host ports below since two
    # containers can't publish to the same host port. See docker/integration-tests/README.md.
    central-gateway-service:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/gateway-service:${APIML_TAG:-local}
        hostname: central-gateway-service
        environment:
            APIML_SERVICE_APIMLID: central-apiml
            APIML_SERVICE_HOSTNAME: central-gateway-service
            APIML_SERVICE_EXTERNALURL: https://central-gateway-service:10010
            APIML_GATEWAY_REGISTRY_ENABLED: "true"
            APIML_SECURITY_X509_REGISTRY_ALLOWEDUSERS: USER,UNKNOWNUSER
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service-2:10011/eureka/
            logbackService: ZWEAGW1
        ports:
            - "127.0.0.1:20010:10010"
            - "127.0.0.1:25130:5130"
            - "127.0.0.1:26300:6300"

    api-catalog-services-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/api-catalog-services:${APIML_TAG:-local}
        hostname: api-catalog-services-2
        volumes:
            - ./api-defs:/api-defs
        environment:
            APIML_SERVICE_HOSTNAME: api-catalog-services-2
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service-2:10011/eureka/
            logbackService: ZWEAAC2
        ports:
            - "127.0.0.1:20014:10014"
            - "127.0.0.1:25124:5124"
            - "127.0.0.1:26304:6304"

    discovery-service-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/discovery-service:${APIML_TAG:-local}
        hostname: discovery-service-2
        environment:
            APIML_DISCOVERY_ALLPEERSURLS: https://discovery-service-2:10011/eureka
            APIML_SERVICE_HOSTNAME: discovery-service-2
            logbackService: ZWEADS2
        ports:
            - "127.0.0.1:20011:10011"
            - "127.0.0.1:25121:5121"

    zaas-service-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/zaas-service:${APIML_TAG:-local}
        hostname: zaas-service-2
        environment:
            APIML_SERVICE_HOSTNAME: zaas-service-2
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service-2:10011/eureka/
            APIML_SECURITY_X509_ENABLED: "true"
            APIML_SECURITY_X509_ACCEPTFORWARDEDCERT: "true"
            APIML_SECURITY_X509_CERTIFICATESURL: https://central-gateway-service:10010/gateway/certificates
            logbackService: ZWEAZS2
        ports:
            - "127.0.0.1:20023:10023"
            - "127.0.0.1:25120:5120"
            - "127.0.0.1:26301:6301"

    mock-services:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/mock-services:${APIML_TAG:-local}
        hostname: mock-services
        ports:
            - "127.0.0.1:10013:10013"
            - "127.0.0.1:5123:5123"
