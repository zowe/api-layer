services:

    discoverable-client:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/discoverable-client:${APIML_TAG:-local}
        hostname: discoverable-client
        environment:
            APIML_SERVICE_CUSTOMMETADATA_APIML_LB_TYPE: authentication
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://apiml:10011/eureka,https://apiml-2:10011/eureka
        ports:
            - "127.0.0.1:10012:10012"
            - "127.0.0.1:5122:5122"

    discoverable-client-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/discoverable-client:${APIML_TAG:-local}
        hostname: discoverable-client-2
        environment:
            APIML_SERVICE_HOSTNAME: discoverable-client-2
            APIML_SERVICE_CUSTOMMETADATA_APIML_LB_TYPE: authentication
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://apiml-2:10011/eureka,https://apiml:10011/eureka
            logbackService: ZWEADC2
        ports:
            - "127.0.0.1:10112:10012"
            - "127.0.0.1:5112:5122"

    mock-services:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/mock-services:${APIML_TAG:-local}
        hostname: mock-services
        ports:
            - "127.0.0.1:10013:10013"
            - "127.0.0.1:5123:5123"

    # apiml-2 shares apiml's real ports (10010/10011) - the test runner (host-based now) reaches
    # it via different HOST ports instead, via -D*.connectPorts on this job's gradle invocations
    # (the shared environment-configuration-docker-modulith-ha.yml stays untouched). See
    # docker/integration-tests/README.md.
    apiml:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/apiml:${APIML_TAG:-local}
        hostname: apiml
        environment:
            APIML_DISCOVERY_ALLPEERSURLS: https://apiml-2:10011/eureka,https://apiml:10011/eureka
            APIML_SERVICE_HOSTNAME: apiml
            APIML_SERVICE_CUSTOMMETADATA_APIML_LB_TYPE: authentication
            logbackService: ZWEAGW1
        ports:
            - "127.0.0.1:10010:10010"
            - "127.0.0.1:10011:10011"
            - "127.0.0.1:5130:5130"
            - "127.0.0.1:6310:6310"

    apiml-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/apiml:${APIML_TAG:-local}
        hostname: apiml-2
        environment:
            APIML_DISCOVERY_ALLPEERSURLS: https://apiml:10011/eureka,https://apiml-2:10011/eureka
            APIML_SERVICE_HOSTNAME: apiml-2
            APIML_SERVICE_CUSTOMMETADATA_APIML_LB_TYPE: authentication
            logbackService: ZWEAGW2
        ports:
            - "127.0.0.1:10020:10010"
            - "127.0.0.1:10021:10011"
            - "127.0.0.1:5011:5130"
            - "127.0.0.1:6311:6310"
