services:

    # Every "-2" service below shares its primary's real port. The test runner (host-based now)
    # reaches each "-2" instance via a different HOST port instead (a consistent +10000/+10 offset
    # convention used across this repo's HA compose files), via -D*.connectPorts /
    # -Ddiscovery.additionalPort on this job's gradle invocations (the shared
    # environment-configuration-ha.yml stays untouched - several other jobs also use it). See
    # docker/integration-tests/README.md.
    api-catalog-services:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/api-catalog-services:${APIML_TAG:-local}
        hostname: api-catalog-services
        volumes:
            - ./api-defs:/api-defs
        ports:
            - "127.0.0.1:10014:10014"
            - "127.0.0.1:5124:5124"
            - "127.0.0.1:6304:6304"

    api-catalog-services-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/api-catalog-services:${APIML_TAG:-local}
        hostname: api-catalog-services-2
        volumes:
            - ./api-defs:/api-defs
        environment:
            APIML_SERVICE_HOSTNAME: api-catalog-services-2
            logbackService: ZWEAAC2
        ports:
            - "127.0.0.1:20014:10014"
            - "127.0.0.1:25124:5124"
            - "127.0.0.1:26304:6304"

    caching-service:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/caching-service:${APIML_TAG:-local}
        hostname: caching-service
        ports:
            - "127.0.0.1:10016:10016"
            - "127.0.0.1:5126:5126"
            - "127.0.0.1:6306:6306"

    discoverable-client:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/discoverable-client:${APIML_TAG:-local}
        hostname: discoverable-client
        ports:
            - "127.0.0.1:10012:10012"
            - "127.0.0.1:5122:5122"

    discoverable-client-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/discoverable-client:${APIML_TAG:-local}
        hostname: discoverable-client-2
        environment:
            APIML_SERVICE_HOSTNAME: discoverable-client-2
        ports:
            - "127.0.0.1:20012:10012"
            - "127.0.0.1:25122:5122"

    mock-services:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/mock-services:${APIML_TAG:-local}
        hostname: mock-services
        ports:
            - "127.0.0.1:10013:10013"
            - "127.0.0.1:5123:5123"

    discovery-service:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/discovery-service:${APIML_TAG:-local}
        hostname: discovery-service
        volumes:
            - ./api-defs:/api-defs
        environment:
            APIML_DISCOVERY_ALLPEERSURLS: https://discovery-service:10011/eureka,https://discovery-service-2:10011/eureka
            logbackService: ZWEADC2
        ports:
            - "127.0.0.1:10011:10011"
            - "127.0.0.1:5121:5121"

    discovery-service-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/discovery-service:${APIML_TAG:-local}
        hostname: discovery-service-2
        volumes:
            - ./api-defs:/api-defs
        environment:
            APIML_SERVICE_HOSTNAME: discovery-service-2
            APIML_DISCOVERY_ALLPEERSURLS: https://discovery-service-2:10011/eureka,https://discovery-service:10011/eureka
            logbackService: ZWEADS2
        ports:
            - "127.0.0.1:20011:10011"
            - "127.0.0.1:25121:5121"

    zaas-service:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/zaas-service:${APIML_TAG:-local}
        hostname: zaas-service
        ports:
            - "127.0.0.1:10023:10023"
            - "127.0.0.1:5120:5120"
            - "127.0.0.1:6301:6301"

    zaas-service-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/zaas-service:${APIML_TAG:-local}
        hostname: zaas-service-2
        environment:
            APIML_SERVICE_HOSTNAME: zaas-service-2
            logbackService: ZWEAZS2
        ports:
            - "127.0.0.1:20023:10023"
            - "127.0.0.1:25120:5120"
            - "127.0.0.1:26301:6301"

    gateway-service:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/gateway-service:${APIML_TAG:-local}
        hostname: gateway-service
        environment:
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service:10011/eureka/,https://discovery-service-2:10011/eureka/
            APIML_ROUTING_INSTANCEIDHEADER: "true"
        ports:
            - "127.0.0.1:10010:10010"
            - "127.0.0.1:5130:5130"
            - "127.0.0.1:6300:6300"

    gateway-service-2:
        image: ${APIML_IMAGE_PREFIX:-ghcr.io/zowe}/gateway-service:${APIML_TAG:-local}
        hostname: gateway-service-2
        environment:
            APIML_SERVICE_HOSTNAME: gateway-service-2
            APIML_SERVICE_DISCOVERYSERVICEURLS: https://discovery-service:10011/eureka/,https://discovery-service-2:10011/eureka/
            APIML_ROUTING_INSTANCEIDHEADER: "true"
            logbackService: ZWEAGW2
        ports:
            - "127.0.0.1:20010:10010"
            - "127.0.0.1:25130:5130"
            - "127.0.0.1:26300:6300"
