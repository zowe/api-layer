resourceMetrics:
  - resource:
      attributes:
        - key: deployment.environment
          value: { stringValue: "dev" }
        - key: mainframe.lpar.name
          value: { stringValue: "LPAR01" }
        - key: zos.smf.id
          value: { stringValue: "SYS1" }
        - key: zos.sysplex.name
          value: { stringValue: "SYSPLEX1" }
    schemaUrl: https://opentelemetry.io/schemas/1.24.0
    scopeMetrics:
      - scope: {"name":"io.opentelemetry.sdk.logs"}
        metrics: []
      - scope: {"name":"io.opentelemetry.sdk.trace"}
        metrics: []