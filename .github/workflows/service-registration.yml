name: Verify that all services can register

on:
    push:
        branches: [ v2.x.x, v3.x.x ]
        paths-ignore:
            - '**.md'
    pull_request:
        branches: [ v2.x.x, v3.x.x ]
        paths-ignore:
            - '**.md'
    workflow_dispatch:

env:
    JOB_ID: ${{ github.run_id }}-${{ github.run_number }}

jobs:
    BuildAndTest:
        runs-on: ubuntu-latest
        timeout-minutes: 35

        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}

            -   uses: ./.github/actions/setup
            
            -   name: Create Network
                run: |
                    docker network create otel-net

            -   name: Start Golden OTel Collector
                run: |
                    docker run -d \
                        --name golden \
                        --user $(id -u):$(id -g) \
                        --network otel-net \
                        -v ${{ github.workspace }}/expected.yaml:/var/data/expected.yaml \
                        -p 4317:4317 \
                        -p 4318:4318 \
                        ghcr.io/open-telemetry/opentelemetry-collector-contrib/golden:latest \
                            --expected /var/data/expected.yaml \
                            --otlp-http-endpoint 0.0.0.0:4318 \
                            --otlp-endpoint 0.0.0.0:4317 \
                            --ignore-timestamp \
                            --ignore-start-timestamp \
                            --timeout 2m \
                            --ignore-resource-attribute-value service.instance.id \
                            --ignore-metric-attribute-value service.instance.id \
                            --ignore-resource-attribute-value service.version \
                            --ignore-resource-attribute-value service.name \
                            --ignore-metric-attribute-value service.version \
                            --ignore-metric-attribute-value service.name \
                            --ignore-resource-metrics-order \
                            --ignore-scope-metrics-order \
                            --ignore-metrics-order \
                            --ignore-metrics-data-points-order \
                            --ignore-metric-values \
                            --ignore-data-points-attributes-order \
                            --ignore-scope-version

            -   name: Wait for Golden OTel Collector to be ready
                continue-on-error: true
                run: |
                    echo "Waiting for Golden OTel Collector to be ready..."
                    for i in {1..30}; do
                        if curl -s -o /dev/null -w "%{http_code}" http://localhost:4318/ 2>/dev/null | grep -qE "200|405"; then
                            echo "Golden OTel Collector is ready!"
                            exit 0
                        fi
                        echo "Attempt $i/30: Golden OTel Collector not ready yet, waiting..."
                        sleep 2
                    done
                    echo "::warning::Golden OTel Collector failed to start within 60 seconds"
                    docker logs golden
                    exit 1

            # 3. Start COLLECTOR (The Processor)
             # It connects to 'otel-net', reads config from repo, and forwards to 'golden'.
            -   name: Start Collector
                run: |
                    docker run -d \
                        --name collector \
                        --network otel-net \
                        -p 13133:13133 \
                        -v ${{ github.workspace }}/config.yaml:/etc/config.yaml \
                        ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:latest \
                            --config /etc/config.yaml

            -   name: Wait for Collector to be ready
                continue-on-error: true
                run: |
                    echo "Waiting for Collector to be ready..."
                    for i in {1..30}; do
                        if curl -s -o /dev/null -w "%{http_code}" http://localhost:13133/ | grep -q "200"; then
                            echo "Collector is ready!"
                            exit 0
                        fi
                        echo "Attempt $i/30: Collector not ready yet, waiting..."
                        sleep 2
                    done
                    echo "::warning::Collector failed to start within 60 seconds"
                    docker logs collector
                    exit 1

            -   name: Build with Gradle
                run: >
                    ./gradlew clean build --info --scan
            -   name: Run startup check
                run: >
                    ./gradlew runStartUpCheck --info --scan -Denvironment.startServices=true

            -   name: Verify Golden File
                run: |
                      echo "Waiting for Golden Validator to finish..."
                      
                      # This blocks until the golden container exits (success or timeout)
                      EXIT_CODE=$(docker wait golden)
                      
                      # Display logs to see the diff if it failed
                      docker logs golden
                      
                      if [ "$EXIT_CODE" -ne 0 ]; then
                        echo "::error::Trace validation failed! See logs above for diff."
                        exit 1
                      fi
                      echo "Trace validation passed!"

            -   name: Store results
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: BuildAndTest-${{ env.JOB_ID }}
                    path: |
                        */build/reports/**

            -   uses: ./.github/actions/teardown
