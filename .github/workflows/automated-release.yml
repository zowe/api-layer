# This workflow will release project with Gradle
name: Automated binary release

on:
    schedule:
        # * is a special character in YAML so you have to quote this string
        - cron:  '0 0 * * 5'
    workflow_dispatch:
        inputs:
            scope:
                description: 'Specify scope that is to be used.'
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major
                default: 'patch'
            enablers:
                description: 'Release enablers only.'
                required: false
                type: boolean
                default: false
jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 40

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.ZOWE_ROBOT_TOKEN }}

            - uses: ./.github/actions/setup

            - name: Clean git
              run: git reset --hard HEAD

            - name: Set email
              run: git config user.email "zowe-robot@users.noreply.github.com"

            - name: Set name
              run: git config user.name "Zowe Robot"

            - name: Build with Gradle
              shell: bash
              run: |
                  ./gradlew clean build --rerun-tasks

            - name: Release with Gradle automatic
              shell: bash
              run: |
                  ./gradlew release $RELEASE_ARGS -Prelease.useAutomaticVersion=true -Prelease.scope=${{ github.event.inputs.scope || env.DEFAULT_SCOPE }} -Pzowe.deploy.username=$ARTIFACTORY_USERNAME -Pzowe.deploy.password=$ARTIFACTORY_PASSWORD -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD
                  if [ -n "$RELEASE_ARGS" ]; then
                     echo "RELEASE_ARGS is empty. Skipping api catalog .env update."
                  else
                      released_version=$(cat gradle.properties | grep "version=" | sed "s/version=//g")
                      sed -i "/REACT_APP_ZOWE_BUILD_INFO=/c\REACT_APP_ZOWE_BUILD_INFO=${released_version}" api-catalog-ui/frontend/.env
                      git add api-catalog-ui/frontend/.env
                      git commit -m "[skip ci] Update version"
                      git push
                  fi

              env:
                  ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                  ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
                  DEFAULT_SCOPE: 'patch'
                  BUILD_NUMBER: ${{ github.run_number }}
                  BRANCH_NAME: ${{ github.ref_name }}
                  RELEASE_ARGS: ${{ github.event.inputs.enablers == 'true' && '-PreleaseEnablers' || '' }}
            -  name: Store test results
               uses: actions/upload-artifact@v4
               if: failure()
               with:
                    name: ReleaseAutomated-${{ github.run_number }}
                    path: |
                        results/**
                        gateway-service/build/**
                        discovery-service/build/**
                        caching-service/build/**
                        api-catalog-services/build/**
                        zaas-service/build/**

                        /home/runner/.npm/logs/**

            -  uses: ./.github/actions/teardown
