            -   uses: ./.github/actions/teardown

    E2EUITests:
        needs: PublishJibContainers
        runs-on: ubuntu-latest
        timeout-minutes: 30

        # Services now run as a plain docker compose stack (docker/integration-tests/e2e-ui-tests)
        # instead of GitHub Actions' native container/services orchestration. Unlike the other
        # migrated jobs, the pinned Cypress/browser toolchain can't just move to the bare runner -
        # GH Actions container jobs don't get docker-socket access, so a job running *inside*
        # cypress/browsers couldn't itself drive docker compose. Instead the compose file defines
        # cypress as a service using that same pinned image, invoked on demand via
        # `docker compose run` once the stack is up - same network, so hostnames resolve exactly
        # like from the host. discovery-service-2 shares discovery-service's real port, so
        # -Ddiscovery.additionalPort tells the test runner (host-based now) to reach it on the
        # different HOST port the compose file publishes it to - without it the checker silently
        # queries discovery-service's own port instead (same hostname-aliased loopback) and waits
        # forever for discovery-service-2/zaas-service-2 to appear there. See
        # docker/integration-tests/README.md.
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}
            -   uses: ./.github/actions/setup
            -   uses: ./.github/actions/restore-certificates
            -   name: Install npm dependencies API Catalog
                uses: bahmutov/npm-install@v1
                with:
                    install-command: npm ci --legacy-peer-deps
                    working-directory: api-catalog-ui/frontend
            -   name: Cache NPM and Cypress 📦
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.cache/Cypress
                        api-catalog-ui/frontend/node_modules
                    key: my-cache-${{ runner.os }}-${{ hashFiles('api-catalog-ui/frontend/*.json') }}

            -   uses: ./.github/actions/compose-integration-env
                with:
                    compose-file: docker/integration-tests/e2e-ui-tests/docker-compose.yml
                    hosts: >-
                        api-catalog-services discoverable-client discovery-service gateway-service
                        zaas-service caching-service mock-services discovery-service-2
                        gateway-service-2 zaas-service-2
                    image-tag: ${{ env.JOB_ID }}
                    extra-env: |
                        OIDC_CLIENT_ID=${{ secrets.OIDC_CLIENT_ID }}
                        OIDC_CLIENT_PASSWORD=${{ secrets.OIDC_CLIENT_PASSWORD }}
                        OIDC_HOST=${{ secrets.OIDC_HOST }}
                        OIDC_AUTH_URI=${{ secrets.OIDC_AUTH_URI }}
                        OIDC_TOKEN_URI=${{ secrets.OIDC_TOKEN_URI }}
                        OIDC_USER_INFO_URI=${{ secrets.OIDC_USER_INFO_URI }}
                        OIDC_JWKSET_URI=${{ secrets.OIDC_JWKSET_URI }}

            -   name: Run startup check
                run: >
                    ./gradlew runStartUpCheck --scan -Denvironment.config=-ha -Ddiscoverableclient.instances=1
                    -Dgateway.instances=1 -Dcaching.instances=1 -Dapicatalog.instances=1
                    -Ddiscovery.additionalPort=10021
                    -DcentralHosts=api-catalog-services,discoverable-client,discovery-service,gateway-service,zaas-service,caching-service

            -   name: Show status when APIML is not ready yet
                if: failure()
                shell: bash
                run: |
                    curl -k -s https://gateway-service:10010/application/health
                    curl -k -s https://gateway-service-2:10010/application/health

            -   name: Cypress run API Catalog
                run: >
                    docker compose -f docker/integration-tests/e2e-ui-tests/docker-compose.yml run --rm
                    -e CYPRESS_AUTH0_USERNAME=${{ secrets.OIDC_WINNIE_USER }} -e CYPRESS_AUTH0_PASSWORD=${{ secrets.OIDC_WINNIE_PASS }}
                    cypress sh -c "cd api-catalog-ui/frontend && npm run cy:e2e:ci"

            -   name: Dump CGW jacoco data
                run: >
                    java -jar ./scripts/jacococli.jar dump --address gateway-service --port 6300 --destfile ./results/gateway-service.exec

            -   name: Correct Permissions
                run: |
                    chmod 755 -R .gradle

            -   name: Store results
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: E2EUITests-${{ env.JOB_ID }}
                    path: |
                        integration-tests/build/test-results/runStartUpCheck/binary/**
                        integration-tests/build/reports/**
                        results/**

            -   name: Upload screenshots API Catalog
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: cypress-snapshots
                    path: api-catalog-ui/frontend/cypress/screenshots

            -   uses: ./.github/actions/compose-integration-env-teardown
                if: always()
                with:
                    compose-file: docker/integration-tests/e2e-ui-tests/docker-compose.yml

            -   uses: ./.github/actions/teardown

    E2EUITestsModulith:
        # This stage needs to use modulith with gateway-service hostname due to the current OIDC provider setup
        # Where only gateway-service is an allowed hostname for redirects
        needs: PublishJibContainers
        runs-on: ubuntu-latest
        timeout-minutes: 30

        # Services now run as a plain docker compose stack (docker/integration-tests/e2e-ui-tests-modulith)
        # instead of GitHub Actions' native container/services orchestration. See the comment on
        # docker/integration-tests/e2e-ui-tests/docker-compose.yml's cypress service for why the
        # pinned Cypress/browser toolchain is a compose service instead of a `container:` job.
        # gateway-service-2 shares gateway-service's real ports, so the gradle steps below pass
        # -Dgateway.connectPorts / -Ddiscovery.additionalPort so the test runner (host-based now)
        # reaches it on the different HOST ports the compose file publishes it to. See
        # docker/integration-tests/README.md.
        env:
            CONNECT_PORT_FLAGS: -Dgateway.connectPorts=10010,10020 -Ddiscovery.additionalPort=10021
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}
            -   uses: ./.github/actions/setup
            -   uses: ./.github/actions/restore-certificates
            -   name: Install npm dependencies API Catalog
                uses: bahmutov/npm-install@v1
                with:
                    install-command: npm ci --legacy-peer-deps
                    working-directory: api-catalog-ui/frontend
            -   name: Cache NPM and Cypress 📦
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.cache/Cypress
                        api-catalog-ui/frontend/node_modules
                    key: my-cache-${{ runner.os }}-${{ hashFiles('api-catalog-ui/frontend/*.json') }}

            -   uses: ./.github/actions/compose-integration-env
                with:
                    compose-file: docker/integration-tests/e2e-ui-tests-modulith/docker-compose.yml
                    hosts: discoverable-client mock-services gateway-service gateway-service-2
                    image-tag: ${{ env.JOB_ID }}
                    extra-env: |
                        OIDC_CLIENT_ID=${{ secrets.OIDC_CLIENT_ID }}
                        OIDC_CLIENT_PASSWORD=${{ secrets.OIDC_CLIENT_PASSWORD }}
                        OIDC_HOST=${{ secrets.OIDC_HOST }}
                        OIDC_AUTH_URI=${{ secrets.OIDC_AUTH_URI }}
                        OIDC_TOKEN_URI=${{ secrets.OIDC_TOKEN_URI }}
                        OIDC_USER_INFO_URI=${{ secrets.OIDC_USER_INFO_URI }}
                        OIDC_JWKSET_URI=${{ secrets.OIDC_JWKSET_URI }}

            -   name: Run startup check
                run: >
                    ./gradlew runStartUpCheck --scan -Denvironment.config=-docker-modulith-ha -Ddiscoverableclient.instances=1 -Denvironment.modulith=true -Denvironment.gwCount=1
                    -Dgateway.host=gateway-service,gateway-service-2 -Ddiscovery.host=gateway-service -Ddiscovery.additionalHost=gateway-service-2
                    ${{ env.CONNECT_PORT_FLAGS }}
                    -DcentralHosts=discoverable-client,gateway-service

            -   name: Show status when APIML is not ready yet
                if: failure()
                shell: bash
                run: |
                    curl -k -s https://gateway-service:10010/application/health
                    curl -k -s https://gateway-service-2:10010/application/health

            -   name: Cypress run API Catalog
                run: >
                    docker compose -f docker/integration-tests/e2e-ui-tests-modulith/docker-compose.yml run --rm
                    -e CYPRESS_AUTH0_USERNAME=${{ secrets.OIDC_WINNIE_USER }} -e CYPRESS_AUTH0_PASSWORD=${{ secrets.OIDC_WINNIE_PASS }}
                    cypress sh -c "cd api-catalog-ui/frontend && npm run cy:e2e:ci:modulith"

            -   name: Dump CGW jacoco data
                run: >
                    java -jar ./scripts/jacococli.jar dump --address gateway-service --port 6310 --destfile ./results/gateway-service.exec

            -   name: Correct Permissions
                run: |
                    chmod 755 -R .gradle

            -   name: Store results
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: E2EUITestsModulith-${{ env.JOB_ID }}
                    path: |
                        integration-tests/build/test-results/runStartUpCheck/binary/**
                        integration-tests/build/reports/**
                        results/**

            -   name: Upload screenshots API Catalog
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: cypress-snapshots-modulith
                    path: api-catalog-ui/frontend/cypress/screenshots

            -   uses: ./.github/actions/compose-integration-env-teardown
                if: always()
                with:
                    compose-file: docker/integration-tests/e2e-ui-tests-modulith/docker-compose.yml

            -   uses: ./.github/actions/teardown

