                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Get Container Logs
                if: ${{ false }} # Debug of containers
                run: |
                    docker ps -a
                    docker ps -q | xargs -L 1 docker logs

