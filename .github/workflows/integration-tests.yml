name: Integration tests using JIB containers

on:
    push:
        branches: [ v2.x.x, v3.x.x ]
        paths-ignore:
            - '**.md'
    pull_request:
        branches: [ v2.x.x, v3.x.x ]
        paths-ignore:
            - '**.md'
    workflow_dispatch:

env:
    JOB_ID: ${{ github.run_id }}-${{ github.run_number }}

jobs:
    # Certificates are generated rather than committed, and each run produces a fresh
    # certificate authority. They are therefore generated once here and shared with
    # every other job, so that the container images and the test runners all trust the
    # same authority.
    GenerateCertificates:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}
            -   uses: ./.github/actions/setup

            -   name: Generate certificates
                run: ./gradlew generateCertificates

            -   uses: actions/upload-artifact@v4
                with:
                    name: development-certificates
                    retention-days: 1
                    if-no-files-found: error
                    path: |
                        keystore/ca/**
                        keystore/service/**
                        keystore/client/**
                        keystore/negative/**
                        zaas-client/src/test/resources/localhost.keystore.p12
                        zaas-client/src/test/resources/localhost.truststore.p12
                        common-service-core/src/test/resources/jwt-public-key.pub

    PublishJibContainers:
        needs: GenerateCertificates
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}
            -   uses: ./.github/actions/setup
            -   uses: ./.github/actions/restore-certificates

            -   name: Build Nodejs Sample App
                run: |
                    cd onboarding-enabler-nodejs-sample-app
                    cp ../config/docker/nodejs-service/service-configuration.yml ./config/service-configuration.yml
                    cp -r ../.licence ./.licence
                    cp -r ../keystore ./keystore
                    cp -r ../onboarding-enabler-nodejs ./onboarding-enabler-nodejs
                    docker build -t nodesampleapp .
                    docker tag nodesampleapp ghcr.io/balhar-jakub/nodejs-sample-app:${{ env.JOB_ID }}
                    echo "${{ secrets.PERSONAL_JB_TOKEN }}" | docker login ghcr.io -u balhar-jakub --password-stdin
                    docker push ghcr.io/balhar-jakub/nodejs-sample-app:${{ env.JOB_ID }}

            -   name: Build Python Sample App
                run: |
                    cd onboarding-enabler-python-sample-app
                    cp ../config/docker/python-service/service-configuration.yml ./src/config/service-configuration.yml
                    cp -r ../keystore ./keystore
                    cp -r ../onboarding-enabler-python ./onboarding-enabler-python
                    docker build -t pythonsampleapp .
                    docker tag pythonsampleapp ghcr.io/balhar-jakub/nodejs-sample-app:python${{ env.JOB_ID }}
                    echo "${{ secrets.PERSONAL_JB_TOKEN }}" | docker login ghcr.io -u balhar-jakub --password-stdin
                    docker push ghcr.io/balhar-jakub/nodejs-sample-app:python${{ env.JOB_ID }}


            -   name: Build with Gradle
                run: >
                    ./gradlew clean jib -Djib.serialize=true -Partifactory_user=${{ secrets.ARTIFACTORY_USERNAME }} -Partifactory_password=${{ secrets.ARTIFACTORY_PASSWORD }} -Pzowe.docker.password=${{ secrets.PERSONAL_JB_TOKEN }} -Pzowe.docker.username=balhar-jakub -Pzowe.docker.container=ghcr.io/balhar-jakub/ -Pzowe.docker.tag=${{ env.JOB_ID }}
            -   name: Standalone Catalog
                run: >
                    ./gradlew :api-catalog-services:jib -Djib.serialize=true -Pzowe.jib.image.suffix=standalone -Pzowe.jib.image.javaAgentPort=6304 -Pzowe.jib.image.debugPort=5125 -Partifactory_user=${{ secrets.ARTIFACTORY_USERNAME }} -Partifactory_password=${{ secrets.ARTIFACTORY_PASSWORD }} -Pzowe.docker.password=${{ secrets.PERSONAL_JB_TOKEN }} -Pzowe.docker.username=balhar-jakub -Pzowe.docker.container=ghcr.io/balhar-jakub/ -Pzowe.docker.tag=${{ env.JOB_ID }}

            -   uses: ./.github/actions/teardown

    CITestsModulithUnknownHostnames:
        needs: PublishJibContainers
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # Services now run as a plain docker compose stack (docker/integration-tests/modulith-unknown-hostnames)
        # instead of GitHub Actions' native container/services orchestration - the exact same
        # compose file and commands work unchanged on a developer machine. See
        # docker/integration-tests/README.md.
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}

            -   uses: ./.github/actions/setup
            -   uses: ./.github/actions/restore-certificates

            -   uses: ./.github/actions/compose-integration-env
                with:
                    compose-file: docker/integration-tests/modulith-unknown-hostnames/docker-compose.yml
                    hosts: apiml discoverable-client-unknown mock-services-unknown
                    image-tag: ${{ env.JOB_ID }}

            -   name: Run Startup Check
                if: always()
                run: >
                    ./gradlew runStartUpCheck -Denvironment.config=-docker-modulith -Denvironment.modulith=true
                    -Ddiscoverableclient.instances=1 -DcentralGateway.instances=0
                    -Ddiscoverableclient.host=discoverable-client-unknown -Dzosmf.host=mock-services-unknown
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run CI Tests with Unknown Hostnames
                run: >
                    ENV_CONFIG=docker-modulith ./gradlew :integration-tests:runUnknownHostnamesTests --info
                    -Ddiscoverableclient.instances=1 -Denvironment.config=-docker-modulith -Denvironment.modulith=true
            -   uses: ./.github/actions/dump-jacoco
                if: always()
            -   name: Store results
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: CITestsModulithUnknownHostnames-${{ env.JOB_ID }}
                    path: |
                        integration-tests/build/reports/**
                        results/**
                        integration-tests/build/test-results/runUnknownHostnamesTests/binary/**
                        integration-tests/build/test-results/runStartUpCheck/binary/**
            -   uses: ./.github/actions/compose-integration-env-teardown
                if: always()
                with:
                    compose-file: docker/integration-tests/modulith-unknown-hostnames/docker-compose.yml
            -   uses: ./.github/actions/teardown

    CITestsModulith:
        needs: PublishJibContainers
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # Services now run as a plain docker compose stack (docker/integration-tests/modulith)
        # instead of GitHub Actions' native container/services orchestration - the exact same
        # compose file and commands work unchanged on a developer machine. See
        # docker/integration-tests/README.md.
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}

            -   uses: ./.github/actions/setup
            -   uses: ./.github/actions/restore-certificates

            -   uses: ./.github/actions/compose-integration-env
                with:
                    compose-file: docker/integration-tests/modulith/docker-compose.yml
                    hosts: apiml discoverable-client mock-services
                    image-tag: ${{ env.JOB_ID }}

            -   name: Run Startup Check
                if: always()
                run: >
                    ./gradlew runStartUpCheck -Denvironment.config=-docker-modulith
                    -Denvironment.modulith=true -DcentralGateway.instances=0
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run Modulith CI Tests
                run: >
                    ENV_CONFIG=docker-modulith ./gradlew :integration-tests:runContainerModulithTests --info
                    -Ddiscoverableclient.instances=1 -Denvironment.config=-docker-modulith -Denvironment.modulith=true
                    -Partifactory_user=${{ secrets.ARTIFACTORY_USERNAME }} -Partifactory_password=${{ secrets.ARTIFACTORY_PASSWORD }}
                    -Dtest.hostname=testrunner
            -   uses: ./.github/actions/dump-jacoco
                if: always()
            -   name: Store results
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: ContainerCITestsModulith-${{ env.JOB_ID }}
                    path: |
                        integration-tests/build/reports/**
                        results/**
                        integration-tests/build/test-results/runContainerModulithTests/binary/**
                        integration-tests/build/test-results/runStartUpCheck/binary/**

            -   uses: ./.github/actions/compose-integration-env-teardown
                if: always()
                with:
                    compose-file: docker/integration-tests/modulith/docker-compose.yml

            -   uses: ./.github/actions/teardown

    CITestsModulithSAFProviderHA:
        needs: PublishJibContainers
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # Services now run as a plain docker compose stack (docker/integration-tests/modulith-saf-ha)
        # instead of GitHub Actions' native container/services orchestration - the exact same
        # compose file and commands work unchanged on a developer machine. apiml-2 shares apiml's
        # real ports (10010/10011), so the gradle steps below pass -D*.connectPorts /
        # -Ddiscovery.additionalPort so the test runner (host-based now) reaches it on the
        # different HOST ports the compose file publishes it to, instead of the shared
        # environment-configuration-docker-modulith-ha.yml (also used by several other jobs).
        # See docker/integration-tests/README.md.
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}

            -   uses: ./.github/actions/setup
            -   uses: ./.github/actions/restore-certificates

            -   uses: ./.github/actions/compose-integration-env
                with:
                    compose-file: docker/integration-tests/modulith-saf-ha/docker-compose.yml
                    hosts: apiml apiml-2 discoverable-client
                    image-tag: ${{ env.JOB_ID }}

            -   name: Run Startup Check
                if: always()
                run: >
                    ./gradlew runStartUpCheck -Denvironment.config=-docker-modulith-ha -Ddiscoverableclient.instances=1
                    -Denvironment.gwCount=2 -Dgateway.instances=2 -Ddiscovery.instances=2 -Dcaching.instances=2 -Dapicatalog.instances=2
                    -Dgateway.connectPorts=10010,10020 -Dapicatalog.connectPorts=10010,10020 -Dcaching.connectPorts=10010,10020
                    -Ddiscovery.additionalPort=10021
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD -Denvironment.modulith=true
                    -Dzosmf.instances=0
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run Modulith CI Tests with SAF Provider in HA
                run: >
                    ENV_CONFIG=docker-modulith-ha ./gradlew :integration-tests:runContainerSAFProviderTests --info
                    -Ddiscoverableclient.instances=1 -Denvironment.config=-docker-modulith-ha -Denvironment.modulith=true
                    -Dgateway.connectPorts=10010,10020 -Dapicatalog.connectPorts=10010,10020 -Dcaching.connectPorts=10010,10020
                    -Ddiscovery.additionalPort=10021
                    -Partifactory_user=${{ secrets.ARTIFACTORY_USERNAME }} -Partifactory_password=${{ secrets.ARTIFACTORY_PASSWORD }}
            -   uses: ./.github/actions/dump-jacoco
                if: always()
            -   name: Store results
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: CITestsModulithSAFProviderHA-${{ env.JOB_ID }}
                    path: |
                        integration-tests/build/reports/**
                        results/**
                        integration-tests/build/test-results/runContainerSAFProviderTests/binary/**
                        integration-tests/build/test-results/runStartUpCheck/binary/**

            -   uses: ./.github/actions/compose-integration-env-teardown
                if: always()
                with:
                    compose-file: docker/integration-tests/modulith-saf-ha/docker-compose.yml

            -   uses: ./.github/actions/teardown

    CITestsModulithHA:
        needs: PublishJibContainers
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                type: ["normal", "gateway-chaotic", "discoverableclient-chaotic", "websocket-chaotic", "caching-chaotic"]

        # Services now run as a plain docker compose stack (docker/integration-tests/modulith-ha)
        # instead of GitHub Actions' native container/services orchestration - the exact same
        # compose file and commands work unchanged on a developer machine. apiml-2/apiml-3 and
        # discoverable-client-2 share their primary counterpart's real ports, so the gradle steps
        # below pass -D*.connectPorts / -Ddiscovery.additionalConnectPorts so the test runner
        # (host-based now) reaches them on the different HOST ports the compose file publishes
        # them to, instead of touching the shared environment-configuration-docker-modulith-ha.yml
        # (also used by several other jobs). See docker/integration-tests/README.md. Chaotic tests
        # induce failure via HTTP calls to each instance's own actuator shutdown endpoint, not by
        # manipulating containers directly, so they need no special handling here.
        env:
            CONNECT_PORT_FLAGS: >-
                -Dgateway.connectPorts=10010,10020,10030 -Dapicatalog.connectPorts=10010,10020,10030
                -Dcaching.connectPorts=10010,10020,10030 -Ddiscovery.additionalConnectPorts=10021,10031
                -Ddiscoverableclient.connectPorts=10012,10112
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}

            -   uses: ./.github/actions/setup
            -   uses: ./.github/actions/restore-certificates

            -   uses: ./.github/actions/compose-integration-env
                with:
                    compose-file: docker/integration-tests/modulith-ha/docker-compose.yml
                    hosts: apiml apiml-2 apiml-3 discoverable-client discoverable-client-2 mock-services
                    image-tag: ${{ env.JOB_ID }}

            -   name: Run Startup Check
                if: always()
                run: >
                    ./gradlew runStartUpCheck -Denvironment.config=-docker-modulith-ha -Ddiscoverableclient.instances=2
                    ${{ env.CONNECT_PORT_FLAGS }}
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD -Denvironment.modulith=true
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run Normal HA Tests in Modulith
                if: ${{ 'normal' == matrix.type }}
                run: >
                    ./gradlew runHATests -Denvironment.config=-docker-modulith-ha -Denvironment.gwCount=3
                    ${{ env.CONNECT_PORT_FLAGS }}
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD -Denvironment.modulith=true
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run Gateway Service Chaotic HA Tests in Modulith
                if: ${{ 'gateway-chaotic' == matrix.type }}
                run: >
                    ./gradlew :integration-tests:runChaoticHATests --tests org.zowe.apiml.integration.ha.GatewayChaoticTest
                    -Denvironment.config=-docker-modulith-ha ${{ env.CONNECT_PORT_FLAGS }}
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD -Denvironment.modulith=true
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run Discoverable Client Chaotic HA Tests in Modulith
                if: ${{ 'discoverableclient-chaotic' == matrix.type }}
                run: >
                    ./gradlew :integration-tests:runChaoticHATests --tests org.zowe.apiml.integration.ha.SouthboundServiceChaoticTest
                    -Denvironment.config=-docker-modulith-ha ${{ env.CONNECT_PORT_FLAGS }}
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD -Denvironment.modulith=true
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run WebSocket Chaotic HA Tests in Modulith
                if: ${{ 'websocket-chaotic' == matrix.type }}
                run: >
                    ./gradlew :integration-tests:runChaoticHATests --tests org.zowe.apiml.integration.ha.WebSocketChaoticTest
                    -Denvironment.config=-docker-modulith-ha ${{ env.CONNECT_PORT_FLAGS }}
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD -Denvironment.modulith=true
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run Caching Chaotic HA Tests
                if: ${{ 'caching-chaotic' == matrix.type }}
                run: >
                    ./gradlew :integration-tests:runChaoticHATests --tests org.zowe.apiml.integration.ha.CachingServiceTests
                    -Denvironment.config=-docker-modulith-ha -Denvironment.offPlatform=true -DcloudGateway.enabled=false
                    -Denvironment.modulith=true -Denvironment.chaotic=true ${{ env.CONNECT_PORT_FLAGS }}
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Correct Permisions
                run: |
                    chmod 755 -R .gradle

            -   name: Store results
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: CITestsModulithHA-${{ env.JOB_ID }}-${{ matrix.type }}
                    path: |
                        integration-tests/build/reports/**
                        integration-tests/build/test-results/**

            -   uses: ./.github/actions/compose-integration-env-teardown
                if: always()
                with:
                    compose-file: docker/integration-tests/modulith-ha/docker-compose.yml

            -   uses: ./.github/actions/teardown

    CITests:
        needs: PublishJibContainers
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # Services now run as a plain docker compose stack (docker/integration-tests/split)
        # instead of GitHub Actions' native container/services orchestration - the exact same
        # compose file and commands work unchanged on a developer machine. See
        # docker/integration-tests/README.md.
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}

            -   uses: ./.github/actions/setup
            -   uses: ./.github/actions/restore-certificates

            -   uses: ./.github/actions/compose-integration-env
                with:
                    compose-file: docker/integration-tests/split/docker-compose.yml
                    hosts: >-
                        api-catalog-services caching-service discoverable-client discovery-service
                        gateway-service zaas-service mock-services
                        discovery-service-2 gateway-service-2 zaas-service-2
                    image-tag: ${{ env.JOB_ID }}

            -   name: Run Startup Check
                if: always()
                run: >
                    ./gradlew runStartUpCheck -Denvironment.config=-docker-compose -DcentralGateway.instances=0
                    -DcentralHosts=discovery-service-2,gateway-service-2,zaas-service-2
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run CI Tests
                timeout-minutes: 4
                run: >
                    ./gradlew :integration-tests:runContainerTests -Denvironment.config=-docker-compose
                    -Partifactory_user=${{ secrets.ARTIFACTORY_USERNAME }} -Partifactory_password=${{ secrets.ARTIFACTORY_PASSWORD }}
                    -Dtest.hostname=testrunner
            -   uses: ./.github/actions/dump-jacoco
                if: always()
            -   name: Store results
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: ContainerCITests-${{ env.JOB_ID }}
                    path: |
                        integration-tests/build/test-results/runStartUpCheck/binary/**
                        integration-tests/build/reports/**
                        results/**

            -   uses: ./.github/actions/compose-integration-env-teardown
                if: always()
                with:
                    compose-file: docker/integration-tests/split/docker-compose.yml

            -   uses: ./.github/actions/teardown

    CITestsSAFProviderHA:
        needs: PublishJibContainers
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # Services now run as a plain docker compose stack (docker/integration-tests/saf-provider-ha)
        # instead of GitHub Actions' native container/services orchestration - the exact same
        # compose file and commands work unchanged on a developer machine. Every "-2" service
        # shares its primary's real port, so the gradle steps below pass -D*.connectPorts /
        # -Ddiscovery.additionalPort so the test runner (host-based now) reaches them on the
        # different HOST ports the compose file publishes them to, instead of touching the shared
        # environment-configuration-ha.yml (also used by several other jobs). See
        # docker/integration-tests/README.md.
        env:
            CONNECT_PORT_FLAGS: >-
                -Dgateway.connectPorts=10010,10020 -Dapicatalog.connectPorts=10014,10024
                -Dzaas.connectPorts=10023,10033 -Ddiscovery.additionalPort=10021
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}

            -   uses: ./.github/actions/setup
            -   uses: ./.github/actions/restore-certificates

            -   uses: ./.github/actions/compose-integration-env
                with:
                    compose-file: docker/integration-tests/saf-provider-ha/docker-compose.yml
                    hosts: >-
                        api-catalog-services api-catalog-services-2 caching-service discoverable-client
                        discovery-service discovery-service-2 gateway-service gateway-service-2
                        zaas-service zaas-service-2
                    image-tag: ${{ env.JOB_ID }}

            -   name: Run Startup Check
                if: always()
                run: >
                    ./gradlew runStartUpCheck -Denvironment.config=-ha -Ddiscoverableclient.instances=1
                    ${{ env.CONNECT_PORT_FLAGS }}
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD
                    -Dcaching.instances=1 -Dzosmf.instances=0
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run CI Tests With SAF Provider
                run: >
                    ENV_CONFIG=ha ./gradlew :integration-tests:runContainerSAFProviderTests -Denvironment.config=-ha
                    ${{ env.CONNECT_PORT_FLAGS }}
                    -Partifactory_user=${{ secrets.ARTIFACTORY_USERNAME }} -Partifactory_password=${{ secrets.ARTIFACTORY_PASSWORD }}
            -   uses: ./.github/actions/dump-jacoco
                if: always()
            -   name: Store results
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: CITestsSAFProviderHA-${{ env.JOB_ID }}
                    path: |
                        integration-tests/build/test-results/runStartUpCheck/binary/**
                        integration-tests/build/reports/**
                        results/**

            -   uses: ./.github/actions/compose-integration-env-teardown
                if: always()
                with:
                    compose-file: docker/integration-tests/saf-provider-ha/docker-compose.yml

            -   uses: ./.github/actions/teardown

    GatewayProxy:
        needs: PublishJibContainers
        runs-on: ubuntu-latest
        timeout-minutes: 10

        # Services now run as a plain docker compose stack (docker/integration-tests/gateway-proxy)
        # instead of GitHub Actions' native container/services orchestration - the exact same
        # compose file and commands work unchanged on a developer machine. central-gateway-service
        # shares gateway-service's real port, so the gradle steps below pass -Dcentralgateway.connectPorts
        # so the test runner (host-based now) reaches it on the different HOST port the compose
        # file publishes it to. See docker/integration-tests/README.md.
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}

            -   uses: ./.github/actions/setup
            -   uses: ./.github/actions/restore-certificates

            -   uses: ./.github/actions/compose-integration-env
                with:
                    compose-file: docker/integration-tests/gateway-proxy/docker-compose.yml
                    hosts: >-
                        discovery-service gateway-service gateway-service-2 zaas-service zaas-service-2
                        central-gateway-service discoverable-client mock-services
                    image-tag: ${{ env.JOB_ID }}

            -   name: Run Startup Check
                if: always()
                run: >
                    ./gradlew runStartUpCheck -Denvironment.config=-docker
                    -Partifactory_user=$ARTIFACTORY_USERNAME -Partifactory_password=$ARTIFACTORY_PASSWORD
                    -Ddiscovery.instances=1 -Dapicatalog.instances=0 -Dcentralgateway.connectPorts=10030
                env:
                    ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Run CI Tests
                run: >
                    ./gradlew :integration-tests:runGatewayProxyTest -Denvironment.config=-docker
                    -Dcentralgateway.connectPorts=10030
                    -Partifactory_user=${{ secrets.ARTIFACTORY_USERNAME }} -Partifactory_password=${{ secrets.ARTIFACTORY_PASSWORD }}

            -   name: Dump CGW jacoco data
                run: >
                    java -jar ./scripts/jacococli.jar dump --address gateway-service --port 6300 --destfile ./results/gateway-service.exec

