    CITestsHA_caching-chaotic:
        needs: PublishJibContainers
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # Services now run as a plain docker compose stack (docker/integration-tests/ha-caching-chaotic)
        # instead of GitHub Actions' native container/services orchestration - the exact same
        # compose file and commands work unchanged on a developer machine. Every "-2"/"-3" service
        # shares its primary's real port, so the gradle steps below pass -D*.connectPorts /
        # -Ddiscovery.additionalPort so the test runner (host-based now) reaches them on the
        # different HOST ports the compose file publishes them to, instead of touching the shared
        # environment-configuration-ha.yml (also used by several other jobs). Chaos is induced via
        # HTTP calls to each instance's own actuator shutdown endpoint, not by manipulating
        # containers directly, so no special handling is needed for that. See
        # docker/integration-tests/README.md.
        env:
            CONNECT_PORT_FLAGS: >-
                -Dgateway.connectPorts=10010,10020 -Dapicatalog.connectPorts=10014,10024
                -Dzaas.connectPorts=10023,10033 -Ddiscovery.additionalPort=10021
                -Ddiscoverableclient.connectPorts=10012,10112 -Dcaching.connectPorts=10016,10026,10036
        steps:
