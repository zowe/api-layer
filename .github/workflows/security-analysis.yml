name: "Flag the PRs touching security related code"

on:
    pull_request:
        branches: [ v2.x.x, v3.x.x ]

jobs:
    analyze:
        name: Identify security related PR
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Scoped to the two GitHub API calls made by the github-script step below:
        #   pull-requests: write - POST /repos/{owner}/{repo}/issues/{issue_number}/labels
        #                          Adding a label to a pull request is enforced against the
        #                          "Pull requests" permission (the target is a PR, not an
        #                          issue), and write also covers the GET of the PR's files.
        #                          Verified by CI: with only "issues: write" the label call
        #                          fails with 403 "Resource not accessible by integration".
        permissions:
            pull-requests: write

        steps:
            - uses: actions/github-script@v7
              with:
                script: |
                    const owner = "zowe";
                    const repository = "api-layer";
                    const prNumber = ${{ github.event.pull_request.number }};
                    const { data } = await github.rest.pulls.listFiles({
                                                owner: owner,
                                                repo: repository,
                                                pull_number: prNumber
                                        });
                    let isRisky = false;

                    data.forEach(file => {
                       if(file.filename.indexOf("security") !== -1) {
                           isRisky = true;
                       }
                    });

                    if(isRisky) {
                       await github.rest.issues.addLabels({
                           owner,
                           repo: repository,
                           issue_number: prNumber,
                           labels: ['Sensitive']
                       });
                    }
