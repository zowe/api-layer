name: zowe-cli-plugin-deployment

on:
    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        # Scoped to the GitHub API calls made by the octorelease plugins configured in
        # zowe-cli-id-federation-plugin/release.config.js (@octorelease/github with checkPrLabels,
        # @octorelease/npm, @octorelease/git):
        #   contents: write - create/update the GitHub Release and upload assets; read pull requests
        #     associated with a commit (GET /commits/{sha}/pulls requires Contents read)
        #   issues: write   - read/add/remove release labels on the PR and create/delete its comments
        # npm publishing authenticates against Artifactory with NPM_USERNAME/NPM_PASSWORD and git
        # operations use GIT_CREDENTIALS, so no other scope is required.
        permissions:
            contents: write
            issues: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ github.ref }}

            - name: Use Node.js LTS
              uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'

            - name: Install Dependencies
              run: |
                 cd zowe-cli-id-federation-plugin
                 npm ci

            - name: Update Dependencies
              uses: zowe-actions/octorelease-script@master
              with:
                  working-dir: zowe-cli-id-federation-plugin
                  script: npmUpdate

              env:
                  GIT_COMMITTER_NAME: ${{ secrets.ZOWE_ROBOT_USER }}
                  GIT_COMMITTER_EMAIL: ${{ secrets.ZOWE_ROBOT_EMAIL }}

            - name: Build Source
              run: |
                  cd zowe-cli-id-federation-plugin
                  npm run build
                  npm version ${{ github.event.inputs.scope || env.DEFAULT_SCOPE }}

            -   name: Update npm configuration
                run: |
                    cd zowe-cli-id-federation-plugin
                    if [ -e .npmrc ]; then
                      rm -f .npmrc
                    fi

            - uses: zowe-actions/octorelease@v1
              with:
                working-dir: zowe-cli-id-federation-plugin
              env:
                  GIT_COMMITTER_NAME: ${{ secrets.ZOWE_ROBOT_USER }}
                  GIT_COMMITTER_EMAIL: ${{ secrets.ZOWE_ROBOT_EMAIL }}
                  GIT_CREDENTIALS: x-access-token:${{ secrets.ZOWE_ROBOT_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                  NPM_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
                  NPM_EMAIL: ${{ secrets.ZOWE_ROBOT_EMAIL }}
