# This workflow will release project with Gradle
name: Automated publish of nodejs and python enabler

on:
    workflow_dispatch:
        inputs:
            scope:
                description: 'Version component to increment (patch: x.y.Z, minor: x.Y.0, major: X.0.0). Used unless an explicit version is provided.'
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major
                default: 'patch'
            version:
                description: 'Set version to override value in package.json in case of existing version in npm registry. Use the latest version in npm registry so the release plugin will properly increase from the current version.'
                required: false
                type: string
            enablerType:
                description: 'Specify which enabler to release.'
                type: choice
                required: false
                options:
                    - node
                    - python
                default: node
            dryRun:
                description: 'Validate the release end to end (build, version bump, publish) without uploading to npm/PyPI and without pushing to the repository.'
                required: false
                type: boolean
                default: false

# All release workflows push commits to protected branches and must not interleave
# with each other or with the API ML release train.
concurrency:
    group: release-train
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.ZOWE_ROBOT_TOKEN }}

            - uses: ./.github/actions/setup

            - name: Clean git
              run: git reset --hard HEAD

            - name: Set email
              run: git config user.email "zowe-robot@users.noreply.github.com"

            - name: Set name
              run: git config user.name "Zowe Robot"

            - name: Checkout Repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.ZOWE_ROBOT_TOKEN }}

            - name: Release NodeJS enabler
              if: ${{ inputs.enablerType == 'node' }}
              uses: ./.github/actions/release-nodejs-enabler
              with:
                version: ${{ github.event.inputs.version }}
                scope: ${{ inputs.scope }}
                dry-run: ${{ inputs.dryRun }}
                npm-token: ${{ secrets.NPM_PUBLIC_TOKEN }}

            - name: Release Python enabler
              if: ${{ inputs.enablerType == 'python' }}
              uses: ./.github/actions/release-python-enabler
              with:
                version: ${{ github.event.inputs.version }}
                dry-run: ${{ inputs.dryRun }}
                zowe-robot-user: ${{ secrets.ZOWE_ROBOT_USER }}
                zowe-robot-email: ${{ secrets.ZOWE_ROBOT_EMAIL }}
                zowe-robot-token: x-access-token:${{ secrets.ZOWE_ROBOT_TOKEN }}
                github-token: ${{ secrets.GITHUB_TOKEN }}
                twine-password: ${{ secrets.PYPI_ROBOT_TOKEN }}
