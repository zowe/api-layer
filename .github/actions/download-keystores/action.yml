name: "Download keystores from PublishJib"
description: "Downloads the keystore artifact generated by PublishJibContainers to ensure identical certificates across CI jobs"

inputs:
    job-id:
        description: "JOB_ID from workflow env"
        required: true

runs:
    using: "composite"
    steps:
        -   uses: actions/download-artifact@v4
            with:
                name: keystores-${{ inputs.job-id }}
                path: keystore
