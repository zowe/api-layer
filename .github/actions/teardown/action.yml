name: "Tear down action"
description: "General clean up after jobs are finished"

inputs:
    cleanBuildCache:
        description: >-
            Delete the Gradle local task-output cache (~/.gradle/caches/build-cache-1)
            entirely. Off by default: the entries are content addressed and immutable,
            keyed on task inputs and outputs, so they are safe to persist and re-use
            between runs. Set to 'true' only when a deliberately cold task-output cache
            is wanted.
        required: false
        default: "false"

runs:
    using: "composite"
    steps:
        # Opt-in measurement; call sites use `if: always()` so failed jobs are reported too
        -   name: Stop resource collection
            if: always() && env.CI_RESOURCE_COLLECTION == 'true'
            run: |
                if [ ! -x scripts/ci/collect-resources.sh ]; then
                    echo "::warning::scripts/ci/collect-resources.sh not found - resource collection skipped"
                    exit 0
                fi
                scripts/ci/collect-resources.sh stop --label "${GITHUB_JOB:-job}" || \
                    echo "::warning::resource collection failed to summarize - this does not affect the job result"
            shell: bash

        -   name: Cleanup Gradle Cache
            # Remove only lock/gc files; keep build-cache-1 entries so tasks can come FROM-CACHE
            shell: bash
            run: |
                rm -f ~/.gradle/caches/modules-2/modules-2.lock
                rm -f ~/.gradle/caches/modules-2/gc.properties
                rm -f ~/.gradle/caches/build-cache-1/build-cache-1.lock
                rm -f ~/.gradle/caches/build-cache-1/gc.properties

        -   name: Remove Gradle task-output cache
            if: inputs.cleanBuildCache == 'true'
            shell: bash
            run: |
                echo "Removing the Gradle local task-output cache (cleanBuildCache=true)"
                rm -rf ~/.gradle/caches/build-cache-1
