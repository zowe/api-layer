name: "Setup action"
description: "Prepares for execution - set up Java, optionally Node/npm, Gradle caches"

inputs:
    jdkVersion:
        description: "JDK version"
        required: false
        default: "17"
    setupNode:
        description: >-
            Set up Node, install npm globally and restore the frontend npm/node_modules
            caches. Only jobs that build or test the frontend, the Node/Python sample
            apps or the enablers need this. Java-only consumers (the integration test
            jobs that run against images published once by PublishJibContainers) must
            set this to 'false': their task graphs contain no npm/node task.
        required: false
        default: "true"
    cacheBuildOutputs:
        description: >-
            Persist the Gradle local task-output cache (~/.gradle/caches/build-cache-1)
            between runs so eligible compile tasks come back FROM-CACHE. Set to 'false'
            to fall back to a cold task-output cache for this job.
        required: false
        default: "true"

runs:
    using: "composite"
    steps:
        # Certificates are generated at build time by keystore/generate-certificates.sh
        # rather than committed, and it needs openssl. The hosted runner image ships
        # it, but jobs that run in a bare container (container: ubuntu:latest) do not -
        # those fail with "openssl: not found". Guarded, so the hosted runners skip the
        # apt-get entirely and only the containers install it.
        -   name: Ensure openssl is available
            run: |
                if command -v openssl > /dev/null 2>&1; then
                    echo "openssl already present: $(openssl version)"
                    exit 0
                fi
                echo "openssl not found - installing"
                if [ "$(id -u)" = "0" ]; then
                    apt-get update && apt-get install -y --no-install-recommends openssl
                else
                    sudo apt-get update && sudo apt-get install -y --no-install-recommends openssl
                fi
                openssl version
            shell: bash

        -   name: Set up JDK ${{ inputs.jdkVersion }}
            uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
            with:
                distribution: 'semeru'
                java-version: ${{ inputs.jdkVersion }}
        -   name: Set up Node
            if: inputs.setupNode == 'true'
            uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
            with:
                node-version: '24.21.0'
        -   name: Install npm
            if: inputs.setupNode == 'true'
            run: npm install -g npm@10.9.9
            shell: bash
        -   name: Grant execute permission for gradlew
            run: chmod +x gradlew
            shell: bash

        # The dependency cache and the local task-output cache are two separate caches
        # with non-overlapping paths. Restoring the whole ~/.gradle/caches directory in
        # one step and the task-output cache in another would restore the same files
        # twice, so the paths below are enumerated explicitly. Gradle keeps its derived
        # state in a version-specific directory (~/.gradle/caches/<version>/transforms and
        # friends), which is why those are matched with a glob and why
        # gradle/wrapper/gradle-wrapper.properties is part of the key.
        -   name: Cache Gradle dependencies
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
            with:
                path: |
                    ~/.gradle/caches/modules-2
                    ~/.gradle/caches/jars-*
                    ~/.gradle/caches/journal-1
                    ~/.gradle/caches/*/transforms
                    ~/.gradle/caches/*/generated-gradle-jars
                    ~/.gradle/caches/*/groovy-dsl
                    ~/.gradle/caches/*/javaCompile
                    ~/.gradle/wrapper
                # Deliberately not keyed on the JDK: downloaded dependencies and wrapper
                # distributions do not depend on the toolchain. Build logic files are
                # keyed because they change the resolution inputs.
                key: ${{ runner.os }}-gradle-deps-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**/*.gradle', 'gradle/**/*.properties', '*/build.gradle', '*/gradle/**/*.gradle', '*/gradle/**/*.properties') }}
                restore-keys: |
                    ${{ runner.os }}-gradle-deps-
        -   name: Cache Gradle local task-output cache
            if: inputs.cacheBuildOutputs == 'true'
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
            with:
                path: |
                    ~/.gradle/caches/build-cache-1
                # Stable key, not a per-run one: the entry is saved once per key and then
                # re-used. A per-run key would save a new copy of this directory on every
                # one of the workflow's jobs and every run, which would exhaust the
                # repository cache quota and evict the dependency cache. The JDK is part
                # of the key because compiled outputs are toolchain specific, and the
                # build logic is part of it because it changes the task inputs.
                key: ${{ runner.os }}-gradle-buildcache-jdk${{ inputs.jdkVersion }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**/*.gradle', 'gradle/**/*.properties', '*/build.gradle', '*/gradle/**/*.gradle', '*/gradle/**/*.properties') }}
                restore-keys: |
                    ${{ runner.os }}-gradle-buildcache-jdk${{ inputs.jdkVersion }}-
                    ${{ runner.os }}-gradle-buildcache-
        -   name: Cache Node.js modules of root folder
            if: inputs.setupNode == 'true'
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
            with:
                path: |
                    ~/.npm
                    node_modules
                key: ${{ runner.OS }}-node-${{ hashFiles('*.json') }}
        -   name: Cache Node.js modules of API Catalog
            if: inputs.setupNode == 'true'
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
            with:
                path: |
                    ~/.npm
                    api-catalog-ui/frontend/node_modules
                key: ${{ runner.OS }}-api-catalog-ui-node-${{ hashFiles('api-catalog-ui/frontend/*.json') }}
        -   name: Cache Node.js modules of Zowe CLI ID Federation Plugin
            if: inputs.setupNode == 'true'
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
            with:
                path: |
                    ~/.npm
                    zowe-cli-id-federation-plugin/node_modules
                key: ${{ runner.OS }}-zowe-cli-id-federation-plugin-node-${{ hashFiles('zowe-cli-id-federation-plugin/*.json') }}
        -   name: Cache Node.js modules of Onboarding Enabler Nodejs
            if: inputs.setupNode == 'true'
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
            with:
                path: |
                    ~/.npm
                    onboarding-enabler-nodejs/node_modules
                key: ${{ runner.OS }}-onboarding-enabler-nodejs-node-${{ hashFiles('onboarding-enabler-nodejs/*.json') }}
        -   name: Cache Node.js modules of Onboarding Enabler Nodejs Sample App
            if: inputs.setupNode == 'true'
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
            with:
                path: |
                    ~/.npm
                    onboarding-enabler-nodejs-sample-app/node_modules
                key: ${{ runner.OS }}-onboarding-enabler-nodejs-sample-app-node-${{ hashFiles('onboarding-enabler-nodejs-sample-app/*.json') }}
        -   name: Cache Node.js modules of ZSS Sample Service
            if: inputs.setupNode == 'true'
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
            with:
                path: |
                    ~/.npm
                    zss-sample-service/node_modules
                key: ${{ runner.OS }}-zss-sample-service-node-${{ hashFiles('zss-sample-service/*.json') }}

        # Resource measurement is opt-in per run (workflow_dispatch input
        # collect_resources -> env CI_RESOURCE_COLLECTION) and never affects the
        # outcome of a job. See docs/testing-resource-budgets.md.
        -   name: Start resource collection
            if: env.CI_RESOURCE_COLLECTION == 'true'
            run: |
                if [ ! -x scripts/ci/collect-resources.sh ]; then
                    echo "::warning::scripts/ci/collect-resources.sh not found - resource collection skipped"
                    exit 0
                fi
                scripts/ci/collect-resources.sh start --label "${GITHUB_JOB:-job}"
            shell: bash
