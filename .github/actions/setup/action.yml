name: "Setup action"
description: "Prepares for execution - set up Java, Node, npm, Gradle"

inputs:
    jdkVersion:
        description: "JDK version"
        required: false
        default: "17"
    requireKeystores:
        description: "Fail the job if the keystore artifact is missing. Set for jobs that pass -PskipKeystoreGeneration and therefore cannot regenerate."
        required: false
        default: "false"

runs:
    using: "composite"
    steps:
        -   name: Install openssl if missing
            run: |
                if ! command -v openssl &>/dev/null; then
                    if [ "$(id -u)" = "0" ]; then apt-get update && apt-get install -y openssl
                    else sudo apt-get update && sudo apt-get install -y openssl; fi
                fi
            shell: bash
        # Only the jobs that cannot generate their own keystores pull the artifact. Every
        # other workflow using this action (docs, changelog, releases) has no such artifact
        # to fetch, and an unconditional download would leave each of their jobs with a
        # failed-but-ignored step.
        -   name: Download keystores
            if: inputs.requireKeystores == 'true'
            uses: actions/download-artifact@v4
            with:
                name: keystores-${{ env.JOB_ID }}
                path: .
            continue-on-error: true
        -   name: Verify keystores are present
            if: inputs.requireKeystores == 'true'
            shell: bash
            run: |
                missing=0
                for f in keystore/localhost/localhost.keystore.p12 \
                         keystore/localhost/localhost.truststore.p12 \
                         keystore/docker/all-services.keystore.p12; do
                    if [ ! -f "$f" ]; then
                        echo "::error::Missing $f"
                        missing=1
                    fi
                done
                if [ "$missing" -ne 0 ]; then
                    echo "::error::Keystore artifact missing or incomplete, and this job runs with -PskipKeystoreGeneration so it cannot regenerate."
                    exit 1
                fi
        -   name: Set up JDK ${{ inputs.jdkVersion }}
            uses: actions/setup-java@v4
            with:
                distribution: 'semeru'
                java-version: ${{ inputs.jdkVersion }}
        -   name: Set up Node
            uses: actions/setup-node@v4
            with:
                node-version: '24.19.0'
        -   run: npm install -g npm@10.9.9
            shell: bash
        -   name: Grant execute permission for gradlew
            run: chmod +x gradlew
            shell: bash

        -   name: Cache Gradle packages
            uses: actions/cache@v4
            with:
                path: |
                    ~/.gradle/caches
                    ~/.gradle/wrapper
                key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'settings.gradle', '*/build.gradle', '*/gradle/**/*.gradle', '*/gradle/**/*.properties') }}
                restore-keys: |
                    ${{ runner.os }}-gradle-
        -   name: Cache Node.js modules of root folder
            uses: actions/cache@v4
            with:
                path: |
                    ~/.npm
                    node_modules
                key: ${{ runner.OS }}-node-${{ hashFiles('*.json') }}
        -   name: Cache Node.js modules of API Catalog
            uses: actions/cache@v4
            with:
                path: |
                    ~/.npm
                    api-catalog-ui/frontend/node_modules
                key: ${{ runner.OS }}-api-catalog-ui-node-${{ hashFiles('api-catalog-ui/frontend/*.json') }}
        -   name: Cache Node.js modules of Zowe CLI ID Federation Plugin
            uses: actions/cache@v4
            with:
                path: |
                    ~/.npm
                    zowe-cli-id-federation-plugin/node_modules
                key: ${{ runner.OS }}-zowe-cli-id-federation-plugin-node-${{ hashFiles('zowe-cli-id-federation-plugin/*.json') }}
        -   name: Cache Node.js modules of Onboarding Enabler Nodejs
            uses: actions/cache@v4
            with:
                path: |
                    ~/.npm
                    onboarding-enabler-nodejs/node_modules
                key: ${{ runner.OS }}-onboarding-enabler-nodejs-node-${{ hashFiles('onboarding-enabler-nodejs/*.json') }}
        -   name: Cache Node.js modules of Onboarding Enabler Nodejs Sample App
            uses: actions/cache@v4
            with:
                path: |
                    ~/.npm
                    onboarding-enabler-nodejs-sample-app/node_modules
                key: ${{ runner.OS }}-onboarding-enabler-nodejs-sample-app-node-${{ hashFiles('onboarding-enabler-nodejs-sample-app/*.json') }}
        -   name: Cache Node.js modules of ZSS Sample Service
            uses: actions/cache@v4
            with:
                path: |
                    ~/.npm
                    zss-sample-service/node_modules
                key: ${{ runner.OS }}-zss-sample-service-node-${{ hashFiles('zss-sample-service/*.json') }}
